<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elevator Dispatch — 3D Simulation</title>
<style>
  :root{
    --ground:#0F141C;
    --panel:#161E29;
    --panel-2:#1B2432;
    --line:#283444;
    --text:#E9EEF5;
    --dim:#8794A6;
    --lantern:#FFB454;
    --good:#7ED491;
    --mono:ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 600px at 70% -10%, #17202e 0%, transparent 60%),
      var(--ground);
    color:var(--text);
    font:15px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:1280px;margin:0 auto;padding:22px 20px 40px}

  /* ── Header ─────────────────────────────── */
  header{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;margin-bottom:16px}
  h1{font-size:21px;font-weight:800;letter-spacing:-.015em;margin:0;text-wrap:balance}
  h1 .tag{color:var(--lantern)}
  .htext{display:flex;flex-direction:column;gap:6px;min-width:0}
  .spec{color:var(--dim);font-size:13px}
  .spec b{color:var(--text);font-weight:600}
  .langSeg{flex:0 0 auto;align-self:center}
  .langSeg button{padding:5px 12px;font-weight:700;letter-spacing:.03em}

  main{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:16px;align-items:start}
  @media (max-width:940px){ main{grid-template-columns:1fr} }

  /* ── Setup screen ───────────────────────── */
  .setup{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 22px 22px}
  .setupHead{margin-bottom:16px}
  .setupHead h2{margin:0 0 4px;font-size:18px;font-weight:800;letter-spacing:-.01em}
  .setupGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  @media (max-width:760px){ .setupGrid{grid-template-columns:1fr} }
  .fgroup{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:13px 15px;display:flex;flex-direction:column;gap:10px}
  .fgroup.wide{grid-column:1 / -1}
  .fgroup h3{margin:0 0 2px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--lantern)}
  .field{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;color:var(--dim)}
  .field>span{flex:1;min-width:0}
  input[type=number]{
    width:92px;background:#0e141d;border:1px solid var(--line);border-radius:7px;color:var(--text);
    font:600 13px/1 var(--mono);padding:7px 9px;text-align:right;font-variant-numeric:tabular-nums;
  }
  input[type=number]:focus,select:focus{outline:2px solid rgba(255,180,84,.5);outline-offset:0}
  select{
    background:#0e141d;border:1px solid var(--line);border-radius:7px;color:var(--text);
    font:600 12px/1 var(--mono);padding:6px 8px;
  }
  .elevHead{display:grid;grid-template-columns:52px 1fr 1fr;gap:8px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:0 2px}
  .elevRows{display:flex;flex-direction:column;gap:7px}
  .erow{display:grid;grid-template-columns:52px 1fr 1fr;gap:8px;align-items:center}
  .erow .tagn{font:800 13px/1 var(--mono);text-align:center;text-shadow:0 0 8px currentColor}
  .erow input[type=number]{width:100%;text-align:center}
  .erow select{width:100%}
  .setupActions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .btn.start{flex:2;min-width:200px;background:linear-gradient(180deg,#ffbe63,#f39c2b);color:#20160a;border-color:transparent;font-weight:800;font-size:14px}
  .btn.start:hover{filter:brightness(1.06);border-color:transparent}
  .setupActions .btn.warn{flex:1;min-width:140px}

  /* tooltips */
  .lbl,.hcell,.rowlbl{display:flex;align-items:center;gap:6px;min-width:0}
  .chkrow{display:flex;align-items:center;gap:7px}
  .tip{
    display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
    width:15px;height:15px;border-radius:50%;border:1px solid var(--line);
    color:var(--dim);font:700 10px/1 system-ui,sans-serif;font-style:normal;
    cursor:help;user-select:none;transition:color .15s,border-color .15s;
  }
  .tip::before{content:'i'}
  .tip:hover,.tip:focus-visible{color:var(--lantern);border-color:var(--lantern);outline:none}
  #tooltip{
    position:fixed;z-index:1000;display:none;max-width:290px;
    background:#0b1017;border:1px solid #34424f;border-radius:8px;padding:9px 11px;
    font:400 12px/1.5 system-ui,-apple-system,sans-serif;color:var(--text);
    box-shadow:0 10px 30px rgba(0,0,0,.55);pointer-events:none;
  }

  .micro{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}

  /* ── 3D scene ───────────────────────────── */
  .stage{
    position:relative;
    background:
      linear-gradient(180deg,#121a26 0%, #0d1219 78%, #0a0e14 100%);
    border:1px solid var(--line);
    border-radius:10px;
    height:660px;
    overflow:hidden;
    touch-action:none;
    cursor:grab;
    user-select:none;
  }
  .stage:active{cursor:grabbing}
  .scene{position:absolute;inset:0;perspective:1500px;perspective-origin:50% 42%}
  .worldZoom{position:absolute;left:50%;top:50%;transform-style:preserve-3d}
  .world{position:absolute;transform-style:preserve-3d}
  .obj,.face{position:absolute;transform-style:preserve-3d}
  .face{backface-visibility:visible}

  .slab{border-top:1px solid rgba(148,178,214,.14);background:rgba(120,150,190,.028)}
  .slab.main{border-top-color:rgba(255,180,84,.28);background:rgba(255,180,84,.04)}
  .roof{background:rgba(150,175,210,.08);border:1px solid rgba(148,178,214,.22)}
  .groundP{
    background:
      repeating-linear-gradient(0deg, rgba(120,150,190,.06) 0 1px, transparent 1px 56px),
      repeating-linear-gradient(90deg, rgba(120,150,190,.06) 0 1px, transparent 1px 56px),
      radial-gradient(closest-side, rgba(60,85,120,.22), rgba(20,28,40,0) 78%);
  }
  .shaftF{background:rgba(140,170,210,.03);border:1px solid rgba(148,178,214,.10)}
  .shaftF.frontF{border-color:rgba(148,178,214,.16)}

  .car .face{border-radius:2px}
  .carFace{opacity:.96}
  .carSide{filter:brightness(.62)}
  .carTop{filter:brightness(1.25)}
  .carFront{overflow:hidden;display:flex;align-items:stretch;justify-content:space-between}
  .carFront .occ{
    position:absolute;top:1px;left:0;right:0;text-align:center;
    font:700 9px/1 var(--mono);color:rgba(10,14,20,.85);z-index:3;
  }
  .door{position:absolute;top:0;bottom:0;width:50%;background:rgba(12,17,24,.55);transition:transform .6s ease;z-index:2}
  .doorL{left:0;border-right:1px solid rgba(255,255,255,.25)}
  .doorR{right:0;border-left:1px solid rgba(255,255,255,.25)}
  .car.open .doorL{transform:translateX(-92%)}
  .car.open .doorR{transform:translateX(92%)}

  .flabel{font:600 9px/1 var(--mono);color:#5f6d80;text-align:right;width:26px}
  .lant{display:flex;flex-direction:column;gap:1px;align-items:center;width:14px}
  .lant span{font:800 8px/1 var(--mono);color:transparent;transition:color .2s}
  .lant span.on{text-shadow:0 0 6px currentColor}

  .hud{
    position:absolute;left:12px;bottom:10px;right:12px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;
    pointer-events:none;font-size:12px;color:var(--dim)
  }
  .ticker{font-family:var(--mono);font-size:11.5px;color:#aebacb;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hint{font-size:11px;text-align:right}

  .stageBtns{position:absolute;top:10px;right:10px;display:flex;gap:6px}
  .stageBtns button{
    background:rgba(22,30,41,.85);border:1px solid var(--line);color:var(--dim);
    border-radius:6px;font-size:11.5px;padding:4px 9px;cursor:pointer;
  }
  .stageBtns button.on{color:var(--lantern);border-color:rgba(255,180,84,.4)}
  .stageBtns button.cfg{color:var(--lantern);border-color:rgba(255,180,84,.35)}

  /* ── Sidebar ────────────────────────────── */
  .side{display:flex;flex-direction:column;gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .card h2{margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}

  .cars{display:grid;grid-template-columns:repeat(auto-fit,minmax(66px,1fr));gap:8px}
  .carChip{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:7px 6px 6px;text-align:center}
  .carChip .nm{font-size:10px;font-weight:800;letter-spacing:.06em}
  .carChip .fl{font:700 22px/1.1 var(--mono);font-variant-numeric:tabular-nums;margin:2px 0 1px;text-shadow:0 0 10px currentColor}
  .carChip .st{font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums}

  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .stat{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  .stat .v{font:700 19px/1.2 var(--mono);font-variant-numeric:tabular-nums}
  .stat .l{font-size:10.5px;color:var(--dim);margin-top:1px}
  .stat .v .u{font-size:11px;color:var(--dim);font-weight:600}

  .floors{max-height:236px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel-2)}
  .frow{display:grid;grid-template-columns:34px 30px 30px 1fr;align-items:center;gap:4px;padding:2px 8px;border-bottom:1px solid rgba(40,52,68,.5);min-height:24px}
  .frow:last-child{border-bottom:0}
  .frow .fl{font:600 12px/1 var(--mono);color:var(--dim);font-variant-numeric:tabular-nums}
  .frow.lobby .fl{color:var(--lantern)}
  .cbtn{background:transparent;border:1px solid var(--line);border-radius:5px;color:#5f6d80;font-size:10px;line-height:1;padding:3px 0;cursor:pointer;width:28px}
  .cbtn:hover{border-color:#3a4a60;color:var(--text)}
  .cbtn.active{color:var(--lantern);border-color:currentColor;text-shadow:0 0 8px currentColor}
  .frow .who{display:flex;gap:3px;justify-content:flex-end;align-items:center}
  .dot{width:7px;height:7px;border-radius:50%;box-shadow:0 0 6px currentColor;background:currentColor}
  .frow .n{font:600 10px/1 var(--mono);color:var(--dim)}

  .ctl{display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .row label{font-size:12.5px;color:var(--dim)}
  .seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .seg button{background:transparent;border:0;color:var(--dim);font-size:11.5px;padding:5px 10px;cursor:pointer;border-right:1px solid var(--line);white-space:nowrap}
  .seg button:last-child{border-right:0}
  .seg button.on{background:rgba(255,180,84,.13);color:var(--lantern)}
  input[type=range]{width:130px;accent-color:var(--lantern)}
  .val{font:600 12px/1 var(--mono);color:var(--text);min-width:66px;text-align:right;font-variant-numeric:tabular-nums}
  .chk{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim);cursor:pointer}
  .chk input{accent-color:var(--lantern)}
  .btnrow{display:flex;gap:8px}
  .btn{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;color:var(--text);font-size:12.5px;font-weight:600;padding:7px 0;cursor:pointer}
  .btn:hover{border-color:#3a4a60}
  .btn.warn{color:var(--lantern)}

  details.exp{margin-top:14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:0}
  details.exp summary{cursor:pointer;padding:12px 16px;font-weight:700;font-size:14px;list-style:none}
  details.exp summary::before{content:'▸ ';color:var(--lantern)}
  details.exp[open] summary::before{content:'▾ '}
  .expBody{padding:2px 18px 16px;max-width:72ch}
  .expBody h3{font-size:13px;margin:14px 0 4px;color:var(--lantern)}
  .expBody p{margin:4px 0;color:#c3ccd8;font-size:13.5px}
  .expBody code{font-family:var(--mono);font-size:12px;background:var(--panel-2);padding:1px 5px;border-radius:4px}

  .cap{margin:2px 0 4px;font-size:11.5px;line-height:1.5;color:var(--dim)}
  .cap b{color:var(--text);font-weight:600}
  .ctl .cap{margin:-4px 0 4px}

  .log{max-height:200px;overflow-y:auto;font:11.5px/1.7 var(--mono);color:#aebacb}
  .log .e{display:flex;gap:10px;padding:1px 2px;border-bottom:1px solid rgba(40,52,68,.35)}
  .log .e:first-child{color:#dfe6ef}
  .log .t{color:#5f6d80;flex:0 0 40px;text-align:right;font-variant-numeric:tabular-nums}
  .log .cn{font-weight:700}
  .log b{font-weight:700}

  ::-webkit-scrollbar{width:8px}
  ::-webkit-scrollbar-thumb{background:#2b3648;border-radius:4px}
  ::-webkit-scrollbar-track{background:transparent}

  @media (prefers-reduced-motion: reduce){
    .door{transition:none}
    .lant span.on{text-shadow:none}
  }
</style>

<div class="wrap">
  <header>
    <div class="htext">
      <h1 id="h1" data-th="h1"></h1>
      <div class="spec" id="spec"></div>
    </div>
    <div class="seg langSeg" id="langSeg">
      <button data-v="en" class="on">EN</button>
      <button data-v="bg">BG</button>
    </div>
  </header>

  <!-- ══════════════ SETUP ══════════════ -->
  <section id="setup" class="setup">
    <div class="setupHead">
      <h2 data-t="setup_title"></h2>
      <p class="cap" data-t="setup_sub"></p>
    </div>
    <div class="setupGrid">
      <div class="fgroup">
        <h3 data-t="grp_structure"></h3>
        <label class="field"><span class="lbl"><span data-t="f_floors"></span><i class="tip" tabindex="0" data-tip="tip_floors"></i></span><input type="number" id="cfgFloors" min="2" max="60" step="1"></label>
        <label class="field"><span class="lbl"><span data-t="f_parking"></span><i class="tip" tabindex="0" data-tip="tip_parking"></i></span><input type="number" id="cfgParking" min="0" max="6" step="1"></label>
      </div>

      <div class="fgroup">
        <h3 data-t="grp_occ"></h3>
        <label class="field"><span class="lbl"><span data-t="f_apts"></span><i class="tip" tabindex="0" data-tip="tip_apts"></i></span><input type="number" id="cfgApts" min="1" max="5000" step="1"></label>
        <label class="field"><span class="lbl"><span data-t="f_res"></span><i class="tip" tabindex="0" data-tip="tip_res"></i></span><input type="number" id="cfgRes" min="1" max="20000" step="1"></label>
        <p class="cap" data-t="f_res_note"></p>
      </div>

      <div class="fgroup">
        <h3 data-t="grp_phys"></h3>
        <label class="field"><span class="lbl"><span data-t="f_spf"></span><i class="tip" tabindex="0" data-tip="tip_spf"></i></span><input type="number" id="cfgSpf" min="0.3" max="6" step="0.1"></label>
        <label class="field"><span class="lbl"><span data-t="f_door"></span><i class="tip" tabindex="0" data-tip="tip_door"></i></span><input type="number" id="cfgDoor" min="0" max="12" step="0.5"></label>
        <label class="field"><span class="lbl"><span data-t="f_hold"></span><i class="tip" tabindex="0" data-tip="tip_hold"></i></span><input type="number" id="cfgHold" min="0.5" max="12" step="0.5"></label>
      </div>

      <div class="fgroup">
        <h3 data-t="grp_traffic"></h3>
        <div class="field"><span class="lbl"><span data-t="f_pattern"></span><i class="tip" tabindex="0" data-tip="tip_pattern"></i></span>
          <div class="seg" id="cfgPatSeg">
            <button data-v="mixed" data-t="pat_mixed"></button>
            <button data-v="morning" data-t="pat_morning"></button>
            <button data-v="evening" data-t="pat_evening"></button>
          </div>
        </div>
        <div class="chkrow"><label class="chk"><input type="checkbox" id="cfgRateAuto"> <span id="rateAutoLbl"></span></label><i class="tip" tabindex="0" data-tip="tip_rate"></i></div>
        <label class="field" id="rateManualWrap"><span class="lbl"><span data-t="f_rate"></span></span><input type="number" id="cfgRate" min="0" max="150" step="1"></label>
        <div class="chkrow"><label class="chk"><input type="checkbox" id="cfgPark"> <span data-t="f_park_beh"></span></label><i class="tip" tabindex="0" data-tip="tip_park"></i></div>
      </div>

      <div class="fgroup wide">
        <h3 data-t="grp_elev"></h3>
        <label class="field"><span class="lbl"><span data-t="f_count"></span><i class="tip" tabindex="0" data-tip="tip_count"></i></span><input type="number" id="cfgCount" min="1" max="16" step="1"></label>
        <p class="cap" data-t="elev_note"></p>
        <div class="elevHead"><span data-t="col_car"></span><span class="hcell"><span data-t="col_cap"></span><i class="tip" tabindex="0" data-tip="tip_cap"></i></span><span class="hcell"><span data-t="col_home"></span><i class="tip" tabindex="0" data-tip="tip_home"></i></span></div>
        <div class="elevRows" id="elevRows"></div>
        <p class="cap" id="elevSummary"></p>
      </div>
    </div>
    <div class="setupActions">
      <button class="btn warn" id="defaultsBtn" data-t="btn_defaults"></button>
      <button class="btn start" id="startBtn" data-t="btn_start"></button>
    </div>
  </section>

  <!-- ══════════════ APP ══════════════ -->
  <div id="app" hidden>
    <main>
      <div>
        <div class="stage" id="stage">
          <div class="scene"><div class="worldZoom" id="zoomEl"><div class="world" id="world"></div></div></div>
          <div class="stageBtns">
            <button id="cfgBtn" class="cfg" data-t="btn_reconf"></button>
            <button id="rotBtn" data-t="btn_rot"></button>
            <button id="pauseBtn"></button>
          </div>
          <div class="hud">
            <div class="ticker" id="ticker"></div>
            <div class="hint" data-th="hint"></div>
          </div>
        </div>

        <section class="card" style="margin-top:14px">
          <h2 data-t="log_h2"></h2>
          <p class="cap" data-t="log_cap"></p>
          <div class="log" id="log"></div>
        </section>

        <details class="exp">
          <summary data-t="exp_summary"></summary>
          <div class="expBody">
            <h3 data-t="exp_h1"></h3><p data-th="exp_p1"></p>
            <h3 data-t="exp_h2"></h3><p data-th="exp_p2"></p>
            <h3 data-t="exp_h3"></h3><p data-th="exp_p3"></p>
            <h3 data-t="exp_h4"></h3><p data-th="exp_p4"></p>
            <h3 data-t="exp_h5"></h3><p data-th="exp_p5"></p>
            <h3 data-t="exp_h6"></h3><p data-th="exp_p6"></p>
          </div>
        </details>
      </div>

      <aside class="side">
        <section class="card">
          <h2 data-t="cars_h2"></h2>
          <p class="cap" data-t="cars_cap"></p>
          <div class="cars" id="carChips"></div>
        </section>

        <section class="card">
          <h2 data-t="stats_h2"></h2>
          <p class="cap" data-t="stats_cap"></p>
          <div class="stats">
            <div class="stat"><div class="v" id="sWait">—</div><div class="l" data-t="stat_wait"></div></div>
            <div class="stat"><div class="v" id="sMax">—</div><div class="l" data-t="stat_max"></div></div>
            <div class="stat"><div class="v" id="sTrip">—</div><div class="l" data-t="stat_trip"></div></div>
            <div class="stat"><div class="v" id="sServed">0</div><div class="l" data-t="stat_served"></div></div>
            <div class="stat" style="grid-column:span 2"><div class="v" id="sRate">—</div><div class="l" id="sRateL"></div></div>
          </div>
        </section>

        <section class="card">
          <h2 data-t="floors_h2"></h2>
          <p class="cap" data-t="floors_cap"></p>
          <div class="floors" id="floorPanel"></div>
        </section>

        <section class="card ctl">
          <h2 data-t="ctl_h2"></h2>
          <div class="row"><span class="rowlbl"><label data-t="lbl_alg"></label><i class="tip" tabindex="0" data-tip="tip_alg"></i></span>
            <div class="seg" id="algSeg">
              <button data-v="smart" class="on" data-t="alg_smart"></button>
              <button data-v="naive" data-t="alg_naive"></button>
            </div>
          </div>
          <p class="cap" data-th="cap_alg"></p>
          <div class="row"><span class="rowlbl"><label data-t="lbl_pattern"></label><i class="tip" tabindex="0" data-tip="tip_pattern"></i></span>
            <div class="seg" id="patSeg">
              <button data-v="mixed" data-t="pat_mixed"></button>
              <button data-v="morning" data-t="pat_morning"></button>
              <button data-v="evening" data-t="pat_evening"></button>
            </div>
          </div>
          <p class="cap" data-th="cap_pattern"></p>
          <div class="row"><span class="rowlbl"><label data-t="lbl_rate"></label><i class="tip" tabindex="0" data-tip="tip_rate"></i></span>

    ev_alg_smart:'Режим: <b>оптимален</b> — повикването отива при кабината с най-малко очаквано време до вас',
    ev_alg_naive:'Режим: <b>наивен</b> — винаги най-близката кабина, без да гледа посока и заетост',
    ev_reset:'Статистиката е нулирана — мери се отначало от този момент.',
    ev_gen:(f,p,n)=>`Сградата е генерирана: ${f} етажа, ${p} паркинг, ${n} кабини. Разпределението работи.`,
  }
};

/* ═══════════════════════ DERIVED (set on generate) ═══════════════════════ */
let LEVELS=18, LOBBY=1, SEC_PER_FLOOR=1.5, DWELL=3.0, parkingEnabled=true;
const REASSIGN_GAIN = 2.0;
const FLOOR_H=30, SHAFT_W=46, GAP=12, DEPTH=48;
let BW=0, BH=0, baseScale=1;

const lbl = i => i<LOBBY ? '−'+(LOBBY-i) : String(i-LOBBY+1);
const lblFor = (i,lob) => i<lob ? '−'+(lob-i) : String(i-lob+1);
const signedFor = (i,lob) => i<lob ? (i-lob) : (i-lob+1);
const homeIndex = (fn) => clamp(fn<0 ? LOBBY+fn : LOBBY+fn-1, 0, LEVELS-1);
const shaftX = i => -BW/2 + GAP + SHAFT_W/2 + i*(SHAFT_W+GAP);
const yOfLine = L => BH/2 - L*FLOOR_H;

/* ═══════════════════════ STATE ═══════════════════════ */
let cars = [];
let hallCalls = [];
let simT=0, speed=2, paused=false, running=false;
let rate=5, pattern='mixed', algo='smart', parking=true, lastReassign=0;
let stats = { waits:[], trips:[], served:0, t0:0 };
const lanterns = [];
let frows = [];

/* ═══════════════════════ ALGORITHM ═══════════════════════ */
function committedStops(car){
  const out = [];
  for (const f of car.carCalls) out.push({level:f, dir:0});
  for (const h of hallCalls) if (h.assigned===car.id) out.push({level:h.level, dir:h.dir});
  return out;
}
function chooseTarget(car){
  const stops = committedStops(car);
  if (!stops.length) return null;
  const pos = car.pos;
  const at = stops.find(s=>Math.abs(s.level-pos)<1e-6);
  if (at && car.phase!=='move') return {level:at.level};
  const pick = (dir)=>{
    const ahead = stops.filter(s=> dir>0 ? s.level>pos+1e-6 : s.level<pos-1e-6);
    if (!ahead.length) return null;
    const inline = ahead.filter(s=> s.dir===0 || s.dir===dir);
    if (inline.length)
      return {level: dir>0 ? Math.min(...inline.map(s=>s.level)) : Math.max(...inline.map(s=>s.level))};
    return {level: dir>0 ? Math.max(...ahead.map(s=>s.level)) : Math.min(...ahead.map(s=>s.level))};
  };
  const d0 = car.dir!==0 ? car.dir : Math.sign(
      stops.reduce((b,s)=> Math.abs(s.level-pos)<Math.abs(b-pos)?s.level:b, stops[0].level) - pos) || 1;
  return pick(d0) || pick(-d0);
}
function etaOf(car, L, d){
  let pos = car.pos, dir = car.dir;
  let tt = car.phase==='doors' ? car.doorLeft : 0;
  const stops = committedStops(car);
  if (algo==='naive') return Math.abs(pos-L)*SEC_PER_FLOOR;
  if (!stops.length) return tt + Math.abs(pos-L)*SEC_PER_FLOOR;
  if (dir===0) dir = Math.sign(L-pos) || 1;
  for (let g=0; g<8; g++){
    const reachable = dir>0 ? L>=pos-1e-6 : L<=pos+1e-6;
    if (d===dir && reachable){
      let n=0;
      for (const s of stops)
        if ((s.dir===0||s.dir===dir) &&
            (dir>0 ? s.level>pos+1e-6 && s.level<L-1e-6 : s.level<pos-1e-6 && s.level>L+1e-6)) n++;
      return tt + Math.abs(L-pos)*SEC_PER_FLOOR + n*DWELL;
    }
    let ext = pos, n=0;
    for (const s of stops){
      const ahead = dir>0 ? s.level>pos+1e-6 : s.level<pos-1e-6;
      if (!ahead) continue;
      ext = dir>0 ? Math.max(ext,s.level) : Math.min(ext,s.level);
    }
    if ((dir>0 && L>ext) || (dir<0 && L<ext)) ext = L;
    for (const s of stops)
      if ((s.dir===0||s.dir===dir) &&
          (dir>0 ? s.level>pos+1e-6 && s.level<=ext+1e-6 : s.level<pos-1e-6 && s.level>=ext-1e-6)) n++;
    tt += Math.abs(ext-pos)*SEC_PER_FLOOR + n*DWELL;
    pos = ext; dir = -dir;
  }
  return tt + 999;
}
function costOf(car, L, d){
  let pending = 0;
  for (const h of hallCalls) if (h.assigned===car.id) pending++;
  const fill = car.pax.length/car.cap;
  return etaOf(car, L, d) + (algo==='smart' ? 0.7*pending + 0.3*car.pax.length + 8*fill*fill : 0);
}
function assign(call){
  let best=-1, bc=Infinity;
  for (const c of cars){ const v = costOf(c, call.level, call.dir); if (v<bc){bc=v;best=c.id;} }
  if (call.assigned!==best){
    call.assigned = best; cars[best].dirty = true;
    logEv(t('ev_call')(lbl(call.level), call.dir>0?'▲':'▼', carTag(cars[best]), Math.max(1,bc).toFixed(0)));
  }
  uiFloorsDirty = true;
}
function reassignPass(){
  if (algo!=='smart') return;
  for (const call of hallCalls){
    const cur = cars[call.assigned];
    if (Math.abs(cur.pos-call.level)<0.7 && (cur.dir===call.dir || cur.dir===0 || cur.phase==='doors')) continue;
    const curCost = costOf(cur, call.level, call.dir);
    let best=call.assigned, bc=curCost;
    for (const c of cars){
      if (c.id===call.assigned) continue;
      const v = costOf(c, call.level, call.dir);
      if (v + REASSIGN_GAIN < bc){bc=v;best=c.id;}
    }
    if (best!==call.assigned){
      const old = call.assigned; call.assigned = best;
      cars[old].dirty = true; cars[best].dirty = true;
      logEv(t('ev_reassign')(lbl(call.level), call.dir>0?'▲':'▼', carTag(cars[old]), carTag(cars[best]), REASSIGN_GAIN.toFixed(0)));
      uiFloorsDirty = true;
    }
  }
}

/* ═══════════════════════ CARS — step ═══════════════════════ */
function decideNext(car){
  car.noService = false; car.parkTrip = false;
  const tgt = chooseTarget(car);
  if (tgt){
    if (Math.abs(tgt.level-car.pos)<1e-6){ arrive(car, tgt.level); return; }
    car.target = tgt.level; car.dir = Math.sign(tgt.level-car.pos); car.phase = 'move'; return;
  }
  if (parking && Math.abs(car.pos-car.park)>1e-6){
    car.target = car.park; car.dir = Math.sign(car.park-car.pos); car.phase='move'; car.parkTrip = true; return;
  }
  car.phase='idle'; car.dir=0; car.target=null;
}
function arrive(car, level){
  car.pos = level; car.target = null;
  if (car.parkTrip || car.noService){ car.phase='idle'; car.dir=0; car.parkTrip=false; car.noService=false; return; }
  const rest = committedStops(car).filter(s=>Math.abs(s.level-level)>1e-6);
  const above = rest.some(s=>s.level>level), below = rest.some(s=>s.level<level);
  let dep = 0;
  if (car.dir>0 && above) dep=1;
  else if (car.dir<0 && below) dep=-1;
  else if (above) dep=1;
  else if (below) dep=-1;
  else { const here = hallCalls.find(h=>h.level===level && h.assigned===car.id); dep = here ? here.dir : 0; }
  let out=0, tripSum=0;
  car.pax = car.pax.filter(p=>{
    if (p.dest===level){ const tr=simT-p.tBoard; stats.trips.push(tr); tripSum+=tr; stats.served++; out++; return false; }
    return true;
  });
  car.carCalls.delete(level);
  let inn=0, waitSum=0;
  for (const h of hallCalls){
    if (h.level!==level) continue;
    if (dep!==0 && h.dir!==dep) continue;
    if (dep===0){ dep = h.dir; }
    while (h.pax.length && car.pax.length<car.cap){
      const p = h.pax.shift();
      const w = simT-p.t0; stats.waits.push(w); waitSum+=w;
      car.pax.push({dest:p.dest, tBoard:simT}); car.carCalls.add(p.dest); inn++;
    }
    if (h.pax.length && car.pax.length>=car.cap)
      logEv(t('ev_full')(carTag(car), car.cap, h.pax.length, lbl(level)));
  }
  hallCalls = hallCalls.filter(h=>h.pax.length>0);
  if (out) logEv(t('ev_drop')(carTag(car), out, lbl(level), (tripSum/out).toFixed(1)));
  if (inn) logEv(t('ev_pick')(carTag(car), inn, lbl(level), dep>0?'▲':dep<0?'▼':'', (waitSum/inn).toFixed(1)));
  car.dir = dep; car.phase='doors'; car.doorLeft = DWELL; car.el.classList.add('open');
  uiFloorsDirty = true;
}
function stepCar(car, dt){
  if (car.phase==='doors'){
    car.doorLeft -= dt;
    if (car.doorLeft <= 0.6) car.el.classList.remove('open');
    if (car.doorLeft <= 0){ car.phase='idle'; decideNext(car); }
    return;
  }
  if (car.phase==='move'){
    if (car.dirty){
      car.dirty=false;
      const tgt = chooseTarget(car);
      if (!tgt){
        car.noService = true;
        car.target = clamp(car.dir>0 ? Math.ceil(car.pos+0.35) : Math.floor(car.pos-0.35), 0, LEVELS-1);
      } else if (tgt.level!==car.target){
        const same = Math.sign(tgt.level-car.pos)===car.dir;
        const far  = Math.abs(tgt.level-car.pos)>=0.35;
        if (same && far){ car.target = tgt.level; car.noService=false; car.parkTrip=false; }
        else if (!same && car.parkTrip){ car.target = tgt.level; car.dir = Math.sign(tgt.level-car.pos); car.parkTrip=false; }
      }
    }
    const step = dt/SEC_PER_FLOOR;
    if (Math.abs(car.target-car.pos)<=step){ arrive(car, car.target); }
    else car.pos += car.dir*step;
    return;
  }
  if (car.dirty || committedStops(car).length){ car.dirty=false; decideNext(car); return; }
  if (parking && Math.abs(car.pos-car.park)>1e-6) decideNext(car);
}

/* ═══════════════════════ TRAFFIC ═══════════════════════ */
const ri = (a,b)=>a+Math.floor(Math.random()*(b-a+1));
const upFrom = ()=>LOBBY+1, upTo=()=>LEVELS-1;
const randUpper = ()=> upFrom()<=upTo() ? ri(upFrom(),upTo()) : LOBBY;
const randParking = ()=> LOBBY>0 ? ri(0,LOBBY-1) : LOBBY;
function spawnPattern(){
  let o,d; const r=Math.random(); const hasPark = LOBBY>0;
  if (pattern==='morning'){
    if (r<0.72){ o=randUpper(); d=(hasPark&&Math.random()<0.22)?randParking():LOBBY; }
    else if (r<0.84){ o=LOBBY; d=randUpper(); }
    else { o=randUpper(); d=randUpper(); }
  } else if (pattern==='evening'){
    if (r<0.60){ o=LOBBY; d=randUpper(); }
    else if (r<0.76){ o=hasPark?randParking():LOBBY; d=randUpper(); }
    else { o=randUpper(); d=(Math.random()<0.7?LOBBY:randUpper()); }
  } else {
    if (r<0.28){ o=LOBBY; d=randUpper(); }
    else if (r<0.36){ o=hasPark?randParking():LOBBY; d=randUpper(); }
    else { o=randUpper(); d=(Math.random()<0.55?LOBBY:(hasPark&&Math.random()<0.12?randParking():randUpper())); }
  }
  if (o===d) return; addPassenger(o,d);
}
function addPassenger(o,d){
  const dir = Math.sign(d-o); if (!dir) return;
  let call = hallCalls.find(h=>h.level===o && h.dir===dir);
  if (!call){ call = {level:o, dir, t0:simT, assigned:-1, pax:[]}; hallCalls.push(call); call.pax.push({dest:d, t0:simT}); assign(call); }
  else { call.pax.push({dest:d, t0:simT}); }
  uiFloorsDirty = true;
}

/* ═══════════════════════ 3D SCENE ═══════════════════════ */
const world = document.getElementById('world');
const zoomEl = document.getElementById('zoomEl');
const stage = document.getElementById('stage');
function el(cls, parent){const e=document.createElement('div');e.className=cls;(parent||world).appendChild(e);return e;}
function face(parent,w,h,tf,cls){
  const f=el('face '+cls,parent);
  f.style.cssText+=`width:${w}px;height:${h}px;left:${-w/2}px;top:${-h/2}px;transform:${tf};`;
  return f;
}
function obj(x,y,z,parent){ const o=el('obj',parent); o.style.transform=`translate3d(${x}px,${y}px,${z}px)`; return o; }

function buildScene(){
  world.innerHTML=''; lanterns.length=0;
  const N = cars.length;
  BW = N*SHAFT_W + (N+1)*GAP;
  BH = LEVELS*FLOOR_H;
  const g = obj(0, BH/2+2, 0);
  face(g, Math.max(560,BW+260), Math.max(560,BW+260), 'rotateX(90deg)', 'groundP');
  const labelStep = LEVELS>26 ? 2 : 1;
  for (let L=0; L<=LEVELS; L++){
    const o = obj(0, yOfLine(L), 0);
    face(o, BW+34, DEPTH+30, 'rotateX(90deg)', L===LEVELS?'roof':(L===LOBBY?'slab main':'slab'));
  }
  for (let i=0;i<N;i++){
    const o = obj(shaftX(i), 0, 0);
    face(o, SHAFT_W, BH, `translateZ(${DEPTH/2}px)`, 'shaftF frontF');
    face(o, SHAFT_W, BH, `translateZ(${-DEPTH/2}px)`, 'shaftF');
    face(o, DEPTH, BH, `rotateY(90deg) translateZ(${SHAFT_W/2}px)`, 'shaftF');
    face(o, DEPTH, BH, `rotateY(-90deg) translateZ(${SHAFT_W/2}px)`, 'shaftF');
  }
  for (let L=0; L<LEVELS; L++){
    const y = yOfLine(L) - FLOOR_H/2;
    if (L%labelStep===0 || L===LOBBY || L===LEVELS-1){
      const lab = obj(-BW/2-30, y, DEPTH/2+2);
      const tx = el('flabel', lab); tx.textContent = lbl(L);
      tx.style.cssText+='position:absolute;left:-13px;top:-5px;';
    }
    const lw = obj(-BW/2-9, y, DEPTH/2+2);
    const box = el('lant', lw); box.style.cssText+='position:absolute;left:-7px;top:-9px;';
    const up = document.createElement('span'); up.textContent='▲';
    const dn = document.createElement('span'); dn.textContent='▼';
    box.append(up,dn); lanterns.push({up,dn});
  }
  for (const car of cars){
    const CW = Math.round(clamp(26+car.cap*1.4, 30, 46));
    const CH = car.cap>=12?25:22, CD = Math.round(clamp(30+car.cap*1.2, 34, 46));
    const o = obj(shaftX(car.id), 0, 0); o.classList.add('car');
    const col = car.color;
    const fr = face(o, CW, CH, `translateZ(${CD/2}px)`, 'carFace carFront'); fr.style.background = col;
    const occ = document.createElement('div'); occ.className='occ'; occ.textContent='0'; fr.appendChild(occ);
    const dl = document.createElement('div'); dl.className='door doorL'; fr.appendChild(dl);
    const dr = document.createElement('div'); dr.className='door doorR'; fr.appendChild(dr);
    face(o, CW, CH, `rotateY(180deg) translateZ(${CD/2}px)`, 'carFace').style.background = col;
    face(o, CD, CH, `rotateY(90deg) translateZ(${CW/2}px)`, 'carFace carSide').style.background = col;
    face(o, CD, CH, `rotateY(-90deg) translateZ(${CW/2}px)`, 'carFace carSide').style.background = col;
    face(o, CW, CD, `rotateX(90deg) translateZ(${CH/2}px)`, 'carFace carTop').style.background = col;
    o.style.filter = `drop-shadow(0 0 8px ${col}55)`;
    car.el = o; car.occEl = occ; car.CH = CH;
  }
  computeFit();
}
function computeFit(){
  const rect = stage.getBoundingClientRect();
  if (!rect.width || !BW) { baseScale=1; return; }
  baseScale = Math.min((rect.width*0.9)/(BW+70), (rect.height*0.9)/(BH+30), 1.2);
}

let rx=-16, ry=-24, zoom=1, autorot=true;

if (reduceMotion) autorot=false;

stage.addEventListener('pointerdown', e=>{ if(e.target.closest('.stageBtns')) return; drag={x:e.clientX,y:e.clientY,rx,ry}; stage.setPointerCapture(e.pointerId);});
stage.addEventListener('pointermove', e=>{ if(!drag) return; ry = drag.ry + (e.clientX-drag.x)*0.4; rx = clamp(drag.rx + (e.clientY-drag.y)*0.25,-45,4); });

const chipsHost = document.getElementById('carChips');

function buildChips(){

function buildFloors(){
  floorPanel.innerHTML=''; frows = [];
  for (let L=LEVELS-1; L>=0; L--){
    const r = document.createElement('div');
    r.className = 'frow'+(L===LOBBY?' lobby':'');
    const canUp = L<LEVELS-1, canDn = L>0;
    r.innerHTML = `<span class="fl">${lbl(L)}</span>
      <button class="cbtn up" ${canUp?'':'disabled style="visibility:hidden"'}>▲</button>

      <span class="who"></span>`;
    floorPanel.appendChild(r);

      else dest = L-1;
      if (dest>=L) dest=L-1;
      addPassenger(L, dest);
    };
    frows[L]={up,dn,who};
  }
}
let uiFloorsDirty = true;
function refreshFloors(){
  for (let L=0;L<LEVELS;L++){
    const f=frows[L]; if(!f) continue;
    const cu = hallCalls.find(h=>h.level===L&&h.dir>0);
    const cd = hallCalls.find(h=>h.level===L&&h.dir<0);
    setBtn(f.up, cu); setBtn(f.dn, cd);
    let html='';
    for (const c of [cu,cd]) if (c && c.assigned>=0)
      html += `<span class="dot" style="color:${cars[c.assigned].color}"></span><span class="n">${c.pax.length}</span>`;
    f.who.innerHTML = html;
    setLant(lanterns[L].up, cu); setLant(lanterns[L].dn, cd);
  }
}
function setBtn(btn, call){
  if (!btn || btn.disabled) return;
  if (call && call.assigned>=0){ btn.classList.add('active'); btn.style.color = cars[call.assigned].color; }
  else { btn.classList.remove('active'); btn.style.color=''; }
}
function setLant(span, call){
  if (call && call.assigned>=0){ span.classList.add('on'); span.style.color = cars[call.assigned].color; }
  else { span.classList.remove('on'); span.style.color='transparent'; }
}

/* ═══════════════════════ LIVE CONTROLS ═══════════════════════ */
function segWire(id, cb){
  const seg=document.getElementById(id);
  seg.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    cb(b.dataset.v);
  });
}
function setSeg(id,val){ document.querySelectorAll('#'+id+' button').forEach(b=>b.classList.toggle('on', b.dataset.v===String(val))); }
segWire('algSeg', v=>{ algo=v; hallCalls.forEach(assign); logEv(v==='smart'? t('ev_alg_smart') : t('ev_alg_naive')); });
segWire('patSeg', v=>pattern=v);
segWire('spdSeg', v=>speed=+v);
segWire('langSeg', v=>applyLang(v));
const rateSl=document.getElementById('rateSl'), rateV=document.getElementById('rateV');
function rateZone(){
  const p=designPeak();
  if (rate===0)  return t('rate_stop');
  if (rate<=Math.max(1,p*0.4)) return t('rate_night');
  if (rate<=p*1.05) return t('rate_normal');
  if (rate<=p*1.8)  return t('rate_peak');
  return t('rate_stress');
}
function syncRate(){
  rateV.textContent = rate+' '+t('unit_pm');
  document.getElementById('rateHint').innerHTML = t('rate_hint')(rateZone());
}
rateSl.oninput=()=>{rate=+rateSl.value; syncRate();};
document.getElementById('parkChk').onchange=e=>{parking=e.target.checked; cars.forEach(c=>c.dirty=true);};
document.getElementById('resetBtn').onclick=()=>{ stats.waits.length=0; stats.trips.length=0; stats.served=0; stats.t0=simT; logEv(t('ev_reset')); };
const pauseBtn=document.getElementById('pauseBtn');
pauseBtn.onclick=()=>{paused=!paused;pauseBtn.textContent=paused?t('btn_play'):t('btn_pause');pauseBtn.classList.toggle('on',paused);};
document.getElementById('cfgBtn').onclick=()=>reconfigure();

/* ticker + log */
const tickerEl=document.getElementById('ticker');
const logHost=document.getElementById('log');
const fmtT=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const carTag=c=>`<b class="cn" style="color:${c.color}">${c.name}</b>`;
function logEv(html){
  const e=document.createElement('div');e.className='e';
  e.innerHTML=`<span class="t">${fmtT(simT)}</span><span>${html}</span>`;
  logHost.prepend(e);
  while(logHost.children.length>80) logHost.removeChild(logHost.lastChild);
  tickerEl.textContent=`${fmtT(simT)} · ${e.children[1].textContent}`;
}

/* stats */
const $=id=>document.getElementById(id);
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
function refreshStats(){
  $('sWait').innerHTML = stats.waits.length? avg(stats.waits).toFixed(1)+'<span class="u"> s</span>':'—';
  $('sTrip').innerHTML = stats.trips.length? avg(stats.trips).toFixed(1)+'<span class="u"> s</span>':'—';
  let mx=0; const now=simT;
  for(const h of hallCalls) for(const p of h.pax) mx=Math.max(mx,now-p.t0);
  $('sMax').innerHTML = hallCalls.length? mx.toFixed(1)+'<span class="u"> s</span>':'—';
  $('sServed').textContent = stats.served;
  const dur = simT - stats.t0;
  if (dur>10 && stats.served>0){
    const pm = stats.served/dur*60;
    $('sRate').innerHTML = pm.toFixed(1)+`<span class="u"> ${t('unit_pm')}</span>`;
    $('sRateL').textContent = t('stat_rate')(Math.round(pm*60), fmtT(dur));
  } else { $('sRate').innerHTML = '—'; $('sRateL').textContent = t('stat_rate_wait'); }
  if (stats.waits.length>400) stats.waits.splice(0,200);
  if (stats.trips.length>400) stats.trips.splice(0,200);
}

/* ═══════════════════════ SPEC / LANG ═══════════════════════ */
function buildSpec(){
  const parkPart = cfg.parking ? `−${cfg.parking} ${t('w_parking')} + ` : '';
  return `<b>${cfg.apartments} ${t('w_apts')}</b> · ≈<b>${cfg.residents} ${t('w_res')}</b> · `
       + `${cfg.parking+cfg.floorsAbove} ${t('w_levels')} (${parkPart}1–${cfg.floorsAbove}) · `
       + `<b>${cfg.elevators.length}</b> ${t('w_cars')} · ${capSummary(cfg.elevators)} · <b>${cfg.secPerFloor} s</b>/${t('w_floor')}`;
}
function applyLang(l){
  lang = (l==='bg') ? 'bg' : 'en';
  try{ localStorage.setItem('elevLang', lang); }catch(e){}
  document.documentElement.lang = lang;
  document.title = t('title');
  document.querySelectorAll('[data-t]').forEach(e=>{ e.textContent = t(e.dataset.t); });
  document.querySelectorAll('[data-th]').forEach(e=>{ e.innerHTML = t(e.dataset.th); });
  document.querySelectorAll('#langSeg button').forEach(b=>b.classList.toggle('on', b.dataset.v===lang));
  document.getElementById('spec').innerHTML = buildSpec();
  document.getElementById('rateAutoLbl').textContent = t('rate_auto')(designPeak());
  updateElevSummary();
  pauseBtn.textContent = paused ? t('btn_play') : t('btn_pause');
  if (cars.length){
    for (const car of cars) car.chipEls.nm.textContent = `${car.name} · ${car.cap} ${t('ppl')}`;
    for (let L=0;L<LEVELS;L++){ if(frows[L]&&frows[L].up) frows[L].up.title=t('call_up_title'); if(frows[L]&&frows[L].dn) frows[L].dn.title=t('call_dn_title'); }
    syncRate(); refreshStats();
  }
  if (!running) tickerEl.textContent = t('ticker_init');
}

/* ═══════════════════════ SETUP SCREEN ═══════════════════════ */
const setupEl = document.getElementById('setup');
const appEl = document.getElementById('app');
const elevRowsEl = document.getElementById('elevRows');
function updateElevSummary(){
  const tot=cfg.elevators.reduce((s,e)=>s+e.cap,0);
  document.getElementById('elevSummary').textContent = t('elev_summary')(cfg.elevators.length, capSummary(cfg.elevators), tot);
}
function homeOptions(sel){
  const lob = clamp(+document.getElementById('cfgParking').value||0,0,6);
  const fa  = clamp(+document.getElementById('cfgFloors').value||2,2,60);
  const total = lob+fa;
  let html='';
  for (let i=total-1;i>=0;i--){
    const sf = signedFor(i,lob);
    html += `<option value="${sf}" ${sf===sel?'selected':''}>${lblFor(i,lob)}</option>`;
  }
  return html;
}
function renderElevRows(){
  elevRowsEl.innerHTML='';
  cfg.elevators.forEach((e,i)=>{
    const col = carColor(i);
    const name = String.fromCharCode(65+i);
    const row = document.createElement('div'); row.className='erow';
    row.innerHTML = `<div class="tagn" style="color:${col}">${name}</div>
      <input type="number" min="2" max="30" step="1" value="${e.cap}" data-i="${i}" data-k="cap">
      <select data-i="${i}" data-k="home">${homeOptions(e.home)}</select>`;
    elevRowsEl.appendChild(row);
  });
  elevRowsEl.querySelectorAll('input[data-k=cap]').forEach(inp=>{
    inp.onchange=()=>{ const i=+inp.dataset.i; cfg.elevators[i].cap=clamp(Math.round(+inp.value||8),2,30); inp.value=cfg.elevators[i].cap; updateElevSummary(); document.getElementById('spec').innerHTML=buildSpec(); };
  });
  elevRowsEl.querySelectorAll('select[data-k=home]').forEach(sel=>{
    sel.onchange=()=>{ const i=+sel.dataset.i; cfg.elevators[i].home=+sel.value; };
  });
  updateElevSummary();
}
function renderSetup(){
  $('cfgFloors').value=cfg.floorsAbove;
  $('cfgParking').value=cfg.parking;
  $('cfgApts').value=cfg.apartments;
  $('cfgRes').value=cfg.residents;
  $('cfgSpf').value=cfg.secPerFloor;
  $('cfgDoor').value=cfg.doorTime;
  $('cfgHold').value=cfg.hold;
  $('cfgCount').value=cfg.elevators.length;
  $('cfgRate').value=cfg.rate;
  $('cfgRateAuto').checked=cfg.rateAuto;
  $('cfgPark').checked=cfg.parkingEnabled;
  setSeg('cfgPatSeg',cfg.pattern);
  document.getElementById('rateManualWrap').style.display = cfg.rateAuto?'none':'';
  document.getElementById('rateAutoLbl').textContent = t('rate_auto')(designPeak());
  renderElevRows();
  document.getElementById('spec').innerHTML = buildSpec();
}
function syncElevCount(n){
  n = clamp(Math.round(n||1),1,MAX_CARS);
  const spread = [1,1,9,14,5,17,3,11,7,12,2,16,4,10,6,13];
  while (cfg.elevators.length<n){ const i=cfg.elevators.length; cfg.elevators.push({cap:i%2?12:8, home:spread[i%spread.length]||1}); }
  while (cfg.elevators.length>n) cfg.elevators.pop();
}
/* setup bindings */
$('cfgFloors').onchange=()=>{ cfg.floorsAbove=clamp(Math.round(+$('cfgFloors').value||17),2,60); $('cfgFloors').value=cfg.floorsAbove; renderElevRows(); document.getElementById('spec').innerHTML=buildSpec(); };
$('cfgParking').onchange=()=>{ cfg.parking=clamp(Math.round(+$('cfgParking').value||0),0,6); $('cfgParking').value=cfg.parking; renderElevRows(); document.getElementById('spec').innerHTML=buildSpec(); };
$('cfgApts').onchange=()=>{ cfg.apartments=clamp(Math.round(+$('cfgApts').value||1),1,5000); $('cfgApts').value=cfg.apartments; document.getElementById('spec').innerHTML=buildSpec(); };
$('cfgRes').onchange=()=>{ cfg.residents=clamp(Math.round(+$('cfgRes').value||1),1,20000); $('cfgRes').value=cfg.residents; document.getElementById('rateAutoLbl').textContent=t('rate_auto')(designPeak()); document.getElementById('spec').innerHTML=buildSpec(); };
$('cfgSpf').onchange=()=>{ cfg.secPerFloor=clamp(+$('cfgSpf').value||1.5,0.3,6); $('cfgSpf').value=cfg.secPerFloor; document.getElementById('spec').innerHTML=buildSpec(); };
$('cfgDoor').onchange=()=>{ cfg.doorTime=clamp(+$('cfgDoor').value||0,0,12); $('cfgDoor').value=cfg.doorTime; };
$('cfgHold').onchange=()=>{ cfg.hold=clamp(+$('cfgHold').value||1.5,0.5,12); $('cfgHold').value=cfg.hold; };
$('cfgCount').onchange=()=>{ syncElevCount(+$('cfgCount').value); $('cfgCount').value=cfg.elevators.length; renderElevRows(); document.getElementById('spec').innerHTML=buildSpec(); };
$('cfgRate').onchange=()=>{ cfg.rate=clamp(Math.round(+$('cfgRate').value||0),0,150); $('cfgRate').value=cfg.rate; };
$('cfgRateAuto').onchange=()=>{ cfg.rateAuto=$('cfgRateAuto').checked; document.getElementById('rateManualWrap').style.display=cfg.rateAuto?'none':''; };
$('cfgPark').onchange=()=>{ cfg.parkingEnabled=$('cfgPark').checked; };
segWire('cfgPatSeg', v=>cfg.pattern=v);
document.getElementById('defaultsBtn').onclick=()=>{ cfg=clone(DEFAULT_CFG); renderSetup(); };
document.getElementById('startBtn').onclick=()=>{ saveCfg(); generate(); enterApp(); };

/* ═══════════════════════ GENERATE / VIEWS ═══════════════════════ */
function generate(){
  LEVELS = cfg.parking + cfg.floorsAbove;
  LOBBY  = cfg.parking;
  SEC_PER_FLOOR = cfg.secPerFloor;
  DWELL = cfg.doorTime + cfg.hold;
  parking = parkingEnabled = cfg.parkingEnabled;
  pattern = cfg.pattern;
  algo = 'smart'; speed = 2; paused = false; zoom = 1;
  rate = cfg.rateAuto ? designPeak() : cfg.rate;
  cars = cfg.elevators.map((e,i)=>({
    id:i, name:String.fromCharCode(65+i), color:carColor(i), cap:clamp(e.cap,2,30),
    park:homeIndex(e.home), pos:homeIndex(e.home), dir:0, phase:'idle', target:null, doorLeft:0,
    parkTrip:false, noService:false, dirty:false, carCalls:new Set(), pax:[], el:null, chipEls:null,
  }));
  hallCalls = []; simT = 0; lastReassign = 0;
  stats = { waits:[], trips:[], served:0, t0:0 };
  buildScene(); buildChips(); buildFloors();
  logHost.innerHTML = `<div class="e"><span class="t">0:00</span><span>${t('log_init')}</span></div>`;
  // live controls reflect config
  setSeg('algSeg','smart'); setSeg('patSeg',cfg.pattern); setSeg('spdSeg','2');
  document.getElementById('parkChk').checked = cfg.parkingEnabled;
  rateSl.max = Math.max(20, designPeak()*4);
  rateSl.value = rate;
  pauseBtn.classList.remove('on'); pauseBtn.textContent = t('btn_pause');
  applyLang(lang);
  logEv(t('ev_gen')(cfg.floorsAbove, cfg.parking, cars.length));
  uiFloorsDirty = true; refreshStats(); refreshFloors();
  for (let k=0;k<Math.min(6,Math.max(3,Math.round(cars.length*1.2)));k++) spawnPattern();
}
function enterApp(){ setupEl.hidden=true; appEl.hidden=false; running=true; paused=false; computeFit(); }
function reconfigure(){ running=false; appEl.hidden=true; setupEl.hidden=false; renderSetup(); }

/* ═══════════════════════ LOOP ═══════════════════════ */
let lastT = performance.now(), statT=0;
function frame(now){
  const dtReal = Math.min(0.1,(now-lastT)/1000); lastT=now;
  if (running && cars.length){
    if (!paused){
      const dt = dtReal*speed; simT += dt;
      if (Math.random() < rate/60*dt) spawnPattern();
      for (const c of cars) stepCar(c, dt);
      if (simT-lastReassign>0.8){ lastReassign=simT; reassignPass(); }
    }
    if (autorot && !drag) ry += dtReal*3.5;
    zoomEl.style.transform = `scale(${baseScale*zoom})`;
    world.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
    for (const c of cars){
      const y = yOfLine(c.pos) - c.CH/2 - 1;
      c.el.style.transform = `translate3d(${shaftX(c.id)}px,${y}px,0)`;
      const flLbl = lbl(Math.round(c.pos));
      if (c.chipEls.fl.textContent!==flLbl) c.chipEls.fl.textContent=flLbl;
      const arrow = c.phase==='move' ? (c.dir>0?'▲':'▼') : (c.phase==='doors'?'◇':'•');
      const st = `${arrow} ${c.pax.length}/${c.cap}`;
      if (c.chipEls.st.textContent!==st) c.chipEls.st.textContent=st;
      const occ=String(c.pax.length);
      if (c.occEl.textContent!==occ) c.occEl.textContent=occ;
    }
    if (uiFloorsDirty){ uiFloorsDirty=false; refreshFloors(); }
    statT+=dtReal;
    if (statT>0.25){ statT=0; refreshStats(); if (hallCalls.length) uiFloorsDirty=true; }
  }
  requestAnimationFrame(frame);
}

/* ═══════════════════════ TOOLTIPS ═══════════════════════ */
const TT = document.createElement('div'); TT.id='tooltip'; document.body.appendChild(TT);
let tipFor = null;
function showTip(icon){
  const key = icon.dataset.tip; const txt = t(key);
  if (!txt) return;
  tipFor = key; TT.textContent = txt; TT.style.display='block';
  const r = icon.getBoundingClientRect();
  const tw = TT.offsetWidth, th = TT.offsetHeight;
  let x = r.left + r.width/2 - tw/2;
  x = Math.max(8, Math.min(x, innerWidth - tw - 8));
  let y = r.bottom + 8;
  if (y + th > innerHeight - 8) y = r.top - th - 8;
  TT.style.left = x+'px'; TT.style.top = y+'px';
}
function hideTip(){ TT.style.display='none'; tipFor=null; }
document.addEventListener('pointerover', e=>{ const i=e.target.closest('.tip'); if(i) showTip(i); });
document.addEventListener('pointerout',  e=>{ const i=e.target.closest('.tip'); if(i) hideTip(); });
document.addEventListener('focusin',  e=>{ const i=e.target.closest('.tip'); if(i) showTip(i); });
document.addEventListener('focusout', e=>{ const i=e.target.closest('.tip'); if(i) hideTip(); });
document.addEventListener('click', e=>{               // tap-to-toggle on touch
  const i=e.target.closest('.tip');
  if(!i){ hideTip(); return; }
  e.preventDefault();
  if (TT.style.display==='block' && tipFor===i.dataset.tip) hideTip(); else showTip(i);
});
addEventListener('scroll', hideTip, true);

/* ═══════════════════════ BOOT ═══════════════════════ */
renderSetup();
applyLang(lang);
tickerEl.textContent = t('ticker_init');
requestAnimationFrame(frame);
</script>
</html>
