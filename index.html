<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elevator Dispatch — 3D Simulation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Clean product style: light surfaces, hairline borders, one indigo accent */
  :root{
    --bg:#f6f7f9;
    --surface:#ffffff;
    --surface-2:#f9fafb;
    --border:#e4e7ec;
    --border-strong:#d0d5dd;
    --text:#101828;
    --text-2:#344054;
    --muted:#667085;
    --accent:#4f46e5;
    --accent-hover:#4338ca;
    --accent-soft:#eef2ff;
    --good:#067647; --good-soft:#ecfdf3;
    --bad:#b42318;  --bad-soft:#fef3f2;
    --shadow:0 1px 2px rgba(16,24,40,.05);
    --radius:10px; --radius-sm:8px;
    --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    /* names read by the canvas code */
    --lantern:var(--accent); --dim:var(--muted);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:14px/1.5 var(--font);min-height:100vh;-webkit-font-smoothing:antialiased;font-feature-settings:'cv11','ss01'}
  button,input,select{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  [hidden]{display:none !important}

  /* ── Top bar ── */
  .topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--border)}
  .topbar .in{max-width:1360px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
  .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:0 0 auto}
  .logo i{display:block;width:12px;height:14px;border:2px solid #fff;border-radius:2px;position:relative}
  .logo i::after{content:'';position:absolute;left:50%;top:1px;bottom:1px;width:2px;margin-left:-1px;background:#fff}
  .htext{display:flex;flex-direction:column;min-width:0}
  h1{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
  .spec{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .spec b{color:var(--text-2);font-weight:500}
  .modeWrap{display:flex;align-items:center;gap:10px}
  .modeWrap .lab{font-size:12px;color:var(--muted)}
  @media (max-width:720px){ .topbar .in{padding:10px 16px} .spec{white-space:normal} .modeWrap .lab{display:none} }

  .wrap{max-width:1360px;margin:0 auto;padding:24px 24px 48px}
  @media (max-width:720px){ .wrap{padding:16px 16px 40px} }

  /* ── Generic pieces ── */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .cardHead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .cardHead h2{margin:0;font-size:14px;font-weight:600}
  .cap{margin:0;font-size:12.5px;line-height:1.5;color:var(--muted)}
  .cap b{color:var(--text-2);font-weight:500}
  .secTitle{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}

  .seg{display:inline-flex;background:#f2f4f7;border:1px solid var(--border);border-radius:var(--radius-sm);padding:2px;gap:2px}
  .seg button{background:transparent;border:0;border-radius:6px;color:var(--muted);font-size:12.5px;font-weight:500;padding:4px 10px;cursor:pointer;white-space:nowrap}
  .seg button:hover{color:var(--text)}
  .seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(16,24,40,.1)}
  .langSeg button{padding:4px 8px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius-sm);color:var(--text-2);font-size:13px;font-weight:500;padding:7px 12px;cursor:pointer;box-shadow:var(--shadow)}
  .btn:hover{background:var(--surface-2);color:var(--text)}
  .btn.primary,.btn.start{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover,.btn.start:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
  .btn.ghost{border-color:transparent;box-shadow:none;background:transparent;color:var(--muted)}
  .btn.ghost:hover,.btn.ghost.on{background:#f2f4f7;color:var(--text)}
  .btnrow{display:flex;gap:8px}
  .btnrow .btn{flex:1}
  .btn{white-space:nowrap}

  input[type=number],select{background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius-sm);font-size:13px;padding:6px 9px;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
  input[type=number]{width:88px;text-align:right}
  input[type=number]:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  input[type=range]{width:140px;accent-color:var(--accent)}
  .chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);cursor:pointer}
  .chk input{accent-color:var(--accent);width:16px;height:16px;margin:0}
  .chkrow{display:flex;align-items:center;gap:8px}
  .val{font-size:13px;font-weight:500;color:var(--text);min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .row label{font-size:13px;color:var(--text-2)}

  /* tooltips */
  .lbl,.hcell,.rowlbl{display:flex;align-items:center;gap:6px;min-width:0}
  .tip{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:15px;height:15px;border:1px solid var(--border-strong);border-radius:50%;color:var(--muted);font:600 9px/1 var(--font);font-style:normal;cursor:help;user-select:none}
  .tip::before{content:'i'}
  .tip:hover,.tip:focus-visible{color:var(--accent);border-color:var(--accent);outline:none}
  #tooltip{position:fixed;z-index:1000;display:none;max-width:300px;background:#101828;color:#fff;border-radius:8px;padding:9px 11px;font:400 12.5px/1.5 var(--font);box-shadow:0 12px 24px -6px rgba(16,24,40,.25);pointer-events:none}

  /* ── Setup ── */
  .setupHead{margin-bottom:16px}
  .setupHead h2{margin:0 0 4px;font-size:22px;font-weight:600;letter-spacing:-.02em}
  .setupHead .cap{max-width:80ch;font-size:13.5px}
  .setupGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  @media (max-width:820px){ .setupGrid{grid-template-columns:1fr} }
  .fgroup{display:flex;flex-direction:column}
  .fgroup.wide{grid-column:1 / -1}
  .fgroup h3{margin:0;padding:12px 16px;font-size:14px;font-weight:600;border-bottom:1px solid var(--border)}
  .fbody{padding:4px 16px 12px;display:flex;flex-direction:column}
  .field{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;color:var(--text-2);padding:8px 0;border-bottom:1px solid #f2f4f7}
  .field>span{flex:1;min-width:0}
  .fbody .cap{padding-top:8px}
  .fbody .chkrow{padding:8px 0;border-bottom:1px solid #f2f4f7}
  .fbody>.field:last-child,.fbody>.chkrow:last-child,.fbody>.field:has(+ .cap){border-bottom:0}
  .elevHead{display:grid;grid-template-columns:44px 1fr 1fr;gap:10px;font-size:12px;font-weight:500;color:var(--muted);padding:12px 0 6px;max-width:520px}
  .elevRows{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px 24px}
  .erow{display:grid;grid-template-columns:44px 1fr 1fr;gap:10px;align-items:center}
  .erow .tagn{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:600}
  .erow input[type=number],.erow select{width:100%;text-align:left}
  .setupActions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
  .setupActions .btn{padding:9px 16px}

  /* ── KPI strip ── */
  .kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
  @media (max-width:1100px){ .kpis{grid-template-columns:repeat(3,minmax(0,1fr))} }
  @media (max-width:560px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} }
  .kpi{padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
  .kpi .l{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi .l::first-letter{text-transform:uppercase}
  .kpi .v{font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.25}
  .kpi .v .u{font-size:14px;font-weight:500;color:var(--muted);margin-left:2px}
  .kpi .d{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:18px}
  .delta{display:inline-block;font-weight:500;border-radius:999px;padding:0 7px;margin-right:4px}
  .delta.good{background:var(--good-soft);color:var(--good)}
  .delta.bad{background:var(--bad-soft);color:var(--bad)}
  .delta.flat{background:#f2f4f7;color:var(--muted)}
  .kpiNote{margin:8px 2px 16px}

  /* ── Main layout ── */
  main{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
  @media (max-width:1000px){ main{grid-template-columns:1fr} }

  /* ── 3D stage ── */
  .stageCard{overflow:hidden}
  .stage{position:relative;background:linear-gradient(180deg,#ffffff,#f3f5f9);height:620px;overflow:hidden;touch-action:none;cursor:grab;user-select:none}
  .stage:active{cursor:grabbing}
  @media (max-width:720px){ .stage{height:480px} }
  .scene{position:absolute;inset:0;perspective:1500px;perspective-origin:50% 42%}
  .worldZoom{position:absolute;left:50%;top:50%;transform-style:preserve-3d}
  .world{position:absolute;transform-style:preserve-3d}
  .obj,.face{position:absolute;transform-style:preserve-3d}
  .face{backface-visibility:visible}
  .slab{border-top:1px solid rgba(16,24,40,.08);background:rgba(16,24,40,.012)}
  .slab.main{border-top:2px solid rgba(79,70,229,.55);background:rgba(79,70,229,.04)}
  .roof{background:rgba(16,24,40,.03);border:1px solid rgba(16,24,40,.12)}
  .groundP{background:
      repeating-linear-gradient(0deg, rgba(16,24,40,.05) 0 1px, transparent 1px 56px),
      repeating-linear-gradient(90deg, rgba(16,24,40,.05) 0 1px, transparent 1px 56px)}
  .shaftF{background:rgba(16,24,40,.015);border:1px solid rgba(16,24,40,.08)}
  .shaftF.frontF{border-color:rgba(16,24,40,.13)}
  .car .face{border-radius:2px}
  .carSide{filter:brightness(.82)}
  .carTop{filter:brightness(1.08)}
  .carFront{overflow:hidden;display:flex;align-items:stretch;justify-content:space-between}
  .carFront .occ{position:absolute;top:2px;left:0;right:0;text-align:center;font:600 9px/1 var(--font);color:#fff;z-index:3}
  .door{position:absolute;top:0;bottom:0;width:50%;background:rgba(16,24,40,.28);z-index:2}
  .doorL{left:0;border-right:1px solid rgba(255,255,255,.5)}
  .doorR{right:0;border-left:1px solid rgba(255,255,255,.5)}
  .flabel{font:500 9px/1 var(--font);color:#98a2b3;text-align:right;width:26px}
  .lant{display:flex;flex-direction:column;gap:1px;align-items:center;width:14px}
  .lant span{font:700 8px/1 var(--font);color:transparent;transition:color .2s}
  .hud{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:10px 14px;pointer-events:none;font-size:12px;color:var(--muted)}
  .ticker{font-size:12px;color:var(--text-2);max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(255,255,255,.88);border:1px solid var(--border);border-radius:999px;padding:3px 10px}
  .hint{font-size:11px;text-align:right}
  .stageBtns{display:flex;gap:4px;flex-wrap:wrap}

  /* explainer */
  details.exp{margin-top:16px}
  details.exp summary{cursor:pointer;padding:12px 16px;font-size:14px;font-weight:600;list-style:none;display:flex;align-items:center;gap:10px}
  details.exp summary::-webkit-details-marker{display:none}
  details.exp summary::before{content:'';width:6px;height:6px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
  details.exp[open] summary::before{transform:rotate(45deg)}
  .expBody{padding:0 16px 16px;max-width:78ch;border-top:1px solid var(--border)}
  .expBody h3{font-size:13.5px;font-weight:600;margin:14px 0 4px}
  .expBody p{margin:4px 0;color:var(--text-2);font-size:13.5px}
  .expBody code{font-family:var(--mono);font-size:12px;background:#f2f4f7;border-radius:4px;padding:1px 5px}

  /* ── Sidebar with tabs ── */
  .side{position:sticky;top:72px}
  @media (max-width:1000px){ .side{position:static} }
  .tabs{display:flex;gap:2px;padding:6px;border-bottom:1px solid var(--border)}
  .tabs button{flex:1;background:transparent;border:0;border-radius:7px;padding:7px 10px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer}
  .tabs button:hover{color:var(--text);background:var(--surface-2)}
  .tabs button.on{color:var(--accent);background:var(--accent-soft)}
  .pane{padding:14px 16px;display:flex;flex-direction:column;gap:16px}
  .ctl{display:flex;flex-direction:column;gap:10px}
  .ctl .secTitle{margin-bottom:0}

  /* car tiles */
  .cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}
  .carChip{border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
  .carChip .nm{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;color:var(--muted);white-space:nowrap}
  .carChip .nm::before{content:'';flex:0 0 auto;width:8px;height:8px;border-radius:2px;background:var(--car)}
  .carChip .fl{font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
  .carChip .st{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

  /* call panel */
  .floors{max-height:236px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-sm)}
  .frow{display:grid;grid-template-columns:36px 32px 32px 1fr;align-items:center;gap:4px;padding:3px 10px;border-bottom:1px solid #f2f4f7;min-height:30px}
  .frow:last-child{border-bottom:0}
  .frow .fl{font-size:12.5px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
  .frow.lobby .fl{color:var(--accent)}
  .cbtn{background:var(--surface);border:1px solid var(--border-strong);border-radius:6px;color:var(--muted);font-size:9px;line-height:1;padding:5px 0;cursor:pointer;width:28px}
  .cbtn:hover{border-color:var(--accent);color:var(--accent)}
  .cbtn.active{color:#fff;border-color:transparent}
  .frow .who{display:flex;gap:4px;justify-content:flex-end;align-items:center}
  .dot{width:8px;height:8px;border-radius:2px;background:currentColor}
  .frow .n{font-size:11.5px;color:var(--muted);margin-right:4px;font-variant-numeric:tabular-nums}

  /* learning view */
  .pill{border:1px solid #c7d2fe;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
  .pill::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.6s ease-in-out infinite}
  .pill.paused::before{animation:none;opacity:.5}
  @keyframes pulse{50%{opacity:.25}}
  .status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;border-radius:999px;padding:2px 10px;background:#f2f4f7;color:var(--muted)}
  .status.running{background:var(--accent-soft);color:var(--accent)}
  .status.error{background:var(--bad-soft);color:var(--bad)}
  .lstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .lstats>div{border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;min-width:0}
  .lstats .l{font-size:11.5px;color:var(--muted);line-height:1.3;min-height:30px}
  .lstats .v{font-size:18px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .lstats .v.good{color:var(--good)} .lstats .v.bad{color:var(--bad)}
  .lstats .v small{font-size:11.5px;font-weight:500;color:var(--muted);margin-left:2px}
  .chart{display:block;width:100%;height:160px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm)}
  .params{display:flex;flex-direction:column;gap:9px;margin-top:8px}
  .prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:12.5px;align-items:baseline}
  .prow .pn{color:var(--text-2)}
  .prow .pv{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
  .prow .pv b{color:var(--text);font-weight:600}
  .prow .track{grid-column:1 / -1;position:relative;height:6px;border-radius:3px;background:#f2f4f7}
  .prow .bar{position:absolute;top:0;bottom:0;border-radius:3px;background:#c7d2fe}
  .prow .mk{position:absolute;top:-3px;width:2px;height:12px;border-radius:1px;transform:translateX(-1px)}
  .prow .mk.v0{background:#98a2b3}
  .prow .mk.now{background:var(--accent);transition:left .4s ease}
  .insights{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
  .insights li{font-size:12.5px;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 10px}
  .ms{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--text-2)}
  .ms li{display:flex;align-items:center;gap:8px}
  .ms li::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--good);flex:0 0 auto}
  .ms li.none{color:var(--muted)} .ms li.none::before{background:var(--border-strong)}
  .ms li.start{color:var(--muted)} .ms li.start::before{background:var(--accent)}

  /* log */
  .log{max-height:560px;overflow-y:auto;font-size:12.5px;line-height:1.6;color:var(--text-2)}
  .log .e{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid #f2f4f7}
  .log .e:first-child{color:var(--text)}
  .log .t{color:#98a2b3;flex:0 0 38px;text-align:right;font-variant-numeric:tabular-nums}
  .log .cn{display:inline-block;min-width:18px;padding:0 5px;border-radius:5px;color:#fff;text-align:center;font-weight:600;font-size:11.5px;line-height:1.6}
  .log b{font-weight:600}

  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#d0d5dd;border-radius:4px}
  ::-webkit-scrollbar-track{background:transparent}
  @media (prefers-reduced-motion: reduce){ .door,details.exp summary::before{transition:none} }
</style>

<header class="topbar">
  <div class="in">
    <div class="brand">
      <div class="logo" aria-hidden="true"><i></i></div>
      <div class="htext">
        <h1 id="h1" data-th="h1"></h1>
        <div class="spec" id="spec"></div>
      </div>
    </div>
    <button class="pill" id="learnPill" hidden></button>
    <button class="btn" id="editBtn" hidden data-t="btn_edit_building"></button>
    <div class="modeWrap" id="modeWrap" hidden>
      <span class="lab" data-t="lbl_alg"></span>
      <div class="seg" id="algSeg">
        <button data-v="learned" data-t="alg_learned"></button>
        <button data-v="v0" class="on" data-t="alg_smart"></button>
        <button data-v="naive" data-t="alg_naive"></button>
      </div>
      <i class="tip" tabindex="0" data-tip="tip_alg"></i>
    </div>
    <div class="seg langSeg" id="langSeg">
      <button data-v="en" class="on">EN</button>
      <button data-v="bg">BG</button>
    </div>
  </div>
</header>

<div class="wrap">
  <!-- ══════════════ SETUP ══════════════ -->
  <section id="setup" class="setup">
    <div class="setupHead">
      <h2 data-t="setup_title"></h2>
      <p class="cap" data-t="setup_sub"></p>
    </div>
    <div class="setupGrid">
      <div class="fgroup card">
        <h3 data-t="grp_structure"></h3>
        <div class="fbody">
          <label class="field"><span class="lbl"><span data-t="f_floors"></span><i class="tip" tabindex="0" data-tip="tip_floors"></i></span><input type="number" id="cfgFloors" min="2" max="60" step="1"></label>
          <label class="field"><span class="lbl"><span data-t="f_parking"></span><i class="tip" tabindex="0" data-tip="tip_parking"></i></span><input type="number" id="cfgParking" min="0" max="6" step="1"></label>
        </div>
      </div>

      <div class="fgroup card">
        <h3 data-t="grp_occ"></h3>
        <div class="fbody">
          <label class="field"><span class="lbl"><span data-t="f_apts"></span><i class="tip" tabindex="0" data-tip="tip_apts"></i></span><input type="number" id="cfgApts" min="1" max="5000" step="1"></label>
          <label class="field"><span class="lbl"><span data-t="f_res"></span><i class="tip" tabindex="0" data-tip="tip_res"></i></span><input type="number" id="cfgRes" min="1" max="20000" step="1"></label>
          <p class="cap" data-t="f_res_note"></p>
        </div>
      </div>

      <div class="fgroup card">
        <h3 data-t="grp_phys"></h3>
        <div class="fbody">
          <label class="field"><span class="lbl"><span data-t="f_spf"></span><i class="tip" tabindex="0" data-tip="tip_spf"></i></span><input type="number" id="cfgSpf" min="0.3" max="6" step="0.1"></label>
          <label class="field"><span class="lbl"><span data-t="f_door"></span><i class="tip" tabindex="0" data-tip="tip_door"></i></span><input type="number" id="cfgDoor" min="0" max="20" step="0.5"></label>
          <label class="field"><span class="lbl"><span data-t="f_hold"></span><i class="tip" tabindex="0" data-tip="tip_hold"></i></span><input type="number" id="cfgHold" min="0.5" max="12" step="0.5"></label>
          <label class="field"><span class="lbl"><span data-t="f_board"></span><i class="tip" tabindex="0" data-tip="tip_board"></i></span><input type="number" id="cfgBoard" min="0" max="3" step="0.1"></label>
        </div>
      </div>

      <div class="fgroup card">
        <h3 data-t="grp_traffic"></h3>
        <div class="fbody">
          <div class="field"><span class="lbl"><span data-t="f_pattern"></span><i class="tip" tabindex="0" data-tip="tip_pattern"></i></span>
            <div class="seg" id="cfgPatSeg">
              <button data-v="mixed" data-t="pat_mixed"></button>
              <button data-v="morning" data-t="pat_morning"></button>
              <button data-v="evening" data-t="pat_evening"></button>
            </div>
          </div>
          <div class="chkrow"><label class="chk"><input type="checkbox" id="cfgRateAuto"> <span id="rateAutoLbl"></span></label><i class="tip" tabindex="0" data-tip="tip_rate"></i></div>
          <label class="field" id="rateManualWrap"><span class="lbl"><span data-t="f_rate"></span></span><input type="number" id="cfgRate" min="0" max="150" step="1"></label>
          <div class="chkrow"><label class="chk"><input type="checkbox" id="cfgPark"> <span data-t="f_park_beh"></span></label><i class="tip" tabindex="0" data-tip="tip_park"></i></div>
        </div>
      </div>

      <div class="fgroup card wide">
        <h3 data-t="grp_elev"></h3>
        <div class="fbody">
          <label class="field"><span class="lbl"><span data-t="f_count"></span><i class="tip" tabindex="0" data-tip="tip_count"></i></span><input type="number" id="cfgCount" min="1" max="16" step="1"></label>
          <p class="cap" data-t="elev_note"></p>
          <div class="elevHead"><span data-t="col_car"></span><span class="hcell"><span data-t="col_cap"></span><i class="tip" tabindex="0" data-tip="tip_cap"></i></span><span class="hcell"><span data-t="col_home"></span><i class="tip" tabindex="0" data-tip="tip_home"></i></span></div>
          <div class="elevRows" id="elevRows"></div>
          <p class="cap" id="elevSummary" style="padding-top:12px"></p>
        </div>
      </div>
    </div>
    <div class="setupActions">
      <button class="btn" id="backBtn" hidden data-t="btn_back_sim"></button>
      <button class="btn" id="defaultsBtn" data-t="btn_defaults"></button>
      <button class="btn start" id="startBtn" data-t="btn_start"></button>
    </div>
  </section>

  <!-- ══════════════ APP ══════════════ -->
  <div id="app" hidden>
    <div class="kpis">
      <div class="card kpi"><div class="l" data-t="stat_wait"></div><div class="v" id="sWait">—</div><div class="d" id="dWait"></div></div>
      <div class="card kpi"><div class="l" data-t="kpi_p95"></div><div class="v" id="sP95">—</div><div class="d" id="dP95"></div></div>
      <div class="card kpi"><div class="l" data-t="stat_max"></div><div class="v" id="sMax">—</div><div class="d" data-t="kpi_now_sub"></div></div>
      <div class="card kpi"><div class="l" data-t="stat_trip"></div><div class="v" id="sTrip">—</div><div class="d" id="dTrip"></div></div>
      <div class="card kpi"><div class="l" data-t="kpi_rate"></div><div class="v" id="sRate">—</div><div class="d" id="sRateL"></div></div>
    </div>
    <p class="cap kpiNote" id="kpiNote"></p>

    <main>
      <div>
        <section class="card stageCard">
          <div class="cardHead">
            <h2 data-t="stage_h2"></h2>
            <div class="stageBtns">
              <button id="pauseBtn" class="btn ghost"></button>
              <button id="rotBtn" class="btn ghost" data-t="btn_rot"></button>
              <button id="cfgBtn" class="btn" data-t="btn_reconf"></button>
            </div>
          </div>
          <div class="stage" id="stage">
            <div class="scene"><div class="worldZoom" id="zoomEl"><div class="world" id="world"></div></div></div>
            <div class="hud">
              <div class="ticker" id="ticker"></div>
              <div class="hint" data-th="hint"></div>
            </div>
          </div>
        </section>

        <details class="exp card">
          <summary data-t="exp_summary"></summary>
          <div class="expBody">
            <h3 data-t="exp_h1"></h3><p data-th="exp_p1"></p>
            <h3 data-t="exp_h2"></h3><p data-th="exp_p2"></p>
            <h3 data-t="exp_h3"></h3><p data-th="exp_p3"></p>
            <h3 data-t="exp_h4"></h3><p data-th="exp_p4"></p>
            <h3 data-t="exp_h5"></h3><p data-th="exp_p5"></p>
            <h3 data-t="exp_h6"></h3><p data-th="exp_p6"></p>
            <h3 data-t="exp_h7"></h3><p data-th="exp_p7"></p>
          </div>
        </details>
      </div>

      <aside class="side card">
        <div class="tabs" id="tabSeg" role="tablist">
          <button data-v="live" class="on" data-t="tab_live" role="tab"></button>
          <button data-v="learn" data-t="tab_learn" role="tab"></button>
          <button data-v="log" data-t="tab_log" role="tab"></button>
        </div>

        <!-- Live -->
        <div class="pane" id="paneLive">
          <div>
            <p class="secTitle" data-t="cars_h2"></p>
            <div class="cars" id="carChips"></div>
          </div>
          <div class="ctl">
            <p class="secTitle" data-t="ctl_h2"></p>
            <div class="row"><span class="rowlbl"><label data-t="lbl_pattern"></label><i class="tip" tabindex="0" data-tip="tip_pattern"></i></span>
              <div class="seg" id="patSeg">
                <button data-v="mixed" data-t="pat_mixed"></button>
                <button data-v="morning" data-t="pat_morning"></button>
                <button data-v="evening" data-t="pat_evening"></button>
              </div>
            </div>
            <div class="row"><span class="rowlbl"><label data-t="lbl_rate"></label><i class="tip" tabindex="0" data-tip="tip_rate"></i></span>
              <span style="display:flex;align-items:center;gap:8px">
                <input type="range" id="rateSl" min="0" max="30" value="5" step="1">
                <span class="val" id="rateV"></span>
              </span>
            </div>
            <p class="cap" id="rateHint"></p>
            <div class="row"><span class="rowlbl"><label data-t="lbl_speed"></label><i class="tip" tabindex="0" data-tip="tip_speed"></i></span>
              <div class="seg" id="spdSeg">
                <button data-v="1">1×</button>
                <button data-v="2" class="on">2×</button>
                <button data-v="4">4×</button>
                <button data-v="8">8×</button>
              </div>
            </div>
            <div class="row">
              <div class="chkrow"><label class="chk"><input type="checkbox" id="parkChk" checked> <span data-t="park_label"></span></label><i class="tip" tabindex="0" data-tip="tip_park"></i></div>
              <span class="chkrow"><button class="btn" id="resetBtn" data-t="reset_btn"></button><i class="tip" tabindex="0" data-tip="tip_reset"></i></span>
            </div>
          </div>
          <div>
            <p class="secTitle" data-t="floors_h2"></p>
            <div class="floors" id="floorPanel"></div>
            <p class="cap" data-t="floors_cap" style="margin-top:8px"></p>
          </div>
        </div>

        <!-- Learning -->
        <div class="pane ctl" id="learnCard" hidden>
          <div class="row">
            <span class="rowlbl"><span class="status" id="learnState"></span><i class="tip" tabindex="0" data-tip="tip_learn"></i></span>
            <span class="btnrow"><button class="btn primary" id="learnBtn"></button><button class="btn" id="learnResetBtn" data-t="learn_reset"></button></span>
          </div>
          <p class="cap" id="learnStatus"></p>
          <div class="lstats">
            <div><div class="l" data-t="learn_k_champ"></div><div class="v" id="lChamp">—</div></div>
            <div><div class="l" data-t="learn_k_gen"></div><div class="v" id="lGen">0</div></div>
            <div><div class="l" data-t="learn_k_hours"></div><div class="v" id="lHours">—</div></div>
          </div>
          <canvas class="chart" id="learnCurve"></canvas>
          <p class="cap" data-t="learn_chart_cap"></p>
          <div>
            <p class="secTitle" data-t="learn_what_h"></p>
            <p class="cap" id="lWhatSrc"></p>
            <div class="params" id="lParams"></div>
            <ul class="insights" id="lInsights"></ul>
          </div>
          <div>
            <p class="secTitle" data-t="learn_ms_h"></p>
            <ol class="ms" id="lMilestones"></ol>
          </div>
          <p class="cap" data-th="learn_cap"></p>
          <div class="btnrow">
            <button class="btn" id="learnExportBtn" data-t="learn_export"></button>
            <button class="btn" id="learnImportBtn" data-t="learn_import"></button>
            <input type="file" id="learnFile" accept=".json,application/json" hidden>
          </div>
          <p class="cap" data-t="cap_learn_io"></p>
        </div>

        <!-- Log -->
        <div class="pane" id="paneLog" hidden>
          <p class="cap" data-t="log_cap"></p>
          <div class="log" id="log"></div>
        </div>
      </aside>
    </main>
  </div>
</div>
<script type="module" src="./src/ui/main.ts"></script>
</html>
