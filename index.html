<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elevator Dispatch — 3D Simulation</title>
<style>
  /* Metro: flat solid tiles, square edges, light lowercase headings, one accent colour */
  :root{
    --ground:#111111;
    --panel:#1d1d1d;
    --panel-2:#262626;
    --line:#333333;
    --text:#ffffff;
    --dim:#a6a6a6;
    --accent:#1ba1e2;
    --accent-2:#1484bc;
    --lantern:var(--accent);
    --good:#60a917;
    --t-wait:#1ba1e2; --t-max:#fa6800; --t-trip:#00aba9; --t-served:#60a917; --t-rate:#6a00ff;
    --font:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
    --font-light:'Segoe UI Variable Display','Segoe UI Light','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
    --mono:'Cascadia Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;border-radius:0}
  html,body{margin:0;padding:0}
  body{background:var(--ground);color:var(--text);font:15px/1.5 var(--font);min-height:100vh;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1320px;margin:0 auto;padding:28px 24px 48px}
  button,input,select{font-family:inherit}
  :focus-visible{outline:2px solid var(--text);outline-offset:2px}

  /* ── Header: small app title over a big light page title ── */
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;margin-bottom:22px}
  .htext{display:flex;flex-direction:column;gap:8px;min-width:0}
  h1{margin:0;font:200 52px/1 var(--font-light);letter-spacing:-.02em;text-transform:lowercase}
  h1 .tag{display:block;margin-bottom:10px;font:600 12px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .spec{color:var(--dim);font-size:13px}
  .spec b{color:var(--text);font-weight:600}
  .langSeg{flex:0 0 auto}
  @media (max-width:560px){ h1{font-size:38px} .wrap{padding:20px 16px 40px} }

  main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
  @media (max-width:960px){ main{grid-template-columns:1fr} }

  /* ── Setup screen ── */
  .setup{background:transparent;padding:0}
  .setupHead{margin-bottom:18px}
  .setupHead h2{margin:0 0 6px;font:300 30px/1.1 var(--font-light);text-transform:lowercase}
  .setupGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  @media (max-width:760px){ .setupGrid{grid-template-columns:1fr} }
  .fgroup{background:var(--panel);padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px;border-top:4px solid var(--accent)}
  .fgroup:nth-child(2){border-top-color:var(--t-trip)}
  .fgroup:nth-child(3){border-top-color:var(--t-max)}
  .fgroup:nth-child(4){border-top-color:var(--t-served)}
  .fgroup:nth-child(5){border-top-color:var(--t-rate)}
  .fgroup.wide{grid-column:1 / -1}
  .fgroup h3{margin:0;font:300 22px/1.1 var(--font-light);text-transform:lowercase;color:var(--text)}
  .field{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;color:var(--dim)}
  .field>span{flex:1;min-width:0}
  input[type=number],select{
    background:#0b0b0b;border:2px solid #555;color:var(--text);
    font:600 14px/1 var(--font);padding:6px 9px;font-variant-numeric:tabular-nums;
  }
  input[type=number]{width:96px;text-align:right}
  input[type=number]:hover,select:hover{border-color:#888}
  input[type=number]:focus,select:focus{outline:none;border-color:var(--accent);background:#fff;color:#000}
  .elevHead{display:grid;grid-template-columns:52px 1fr 1fr;gap:8px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .elevRows{display:flex;flex-direction:column;gap:6px}
  .erow{display:grid;grid-template-columns:52px 1fr 1fr;gap:8px;align-items:stretch}
  .erow .tagn{display:flex;align-items:center;justify-content:center;font:600 18px/1 var(--font);color:#fff;min-height:34px}
  .erow input[type=number],.erow select{width:100%;text-align:center}
  .setupActions{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
  .btn.start{flex:2;min-width:220px;background:var(--accent);border-color:var(--accent);color:#fff;font-size:16px;font-weight:600;padding:12px 0;text-transform:lowercase}
  .btn.start:hover{background:var(--accent-2);border-color:var(--accent-2)}
  .setupActions .btn.warn{flex:1;min-width:150px}

  /* ── Tooltips ── */
  .lbl,.hcell,.rowlbl{display:flex;align-items:center;gap:7px;min-width:0}
  .chkrow{display:flex;align-items:center;gap:8px}
  .tip{
    display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
    width:16px;height:16px;border:1px solid #666;border-radius:50%;
    color:var(--dim);font:700 10px/1 var(--font);font-style:normal;cursor:help;user-select:none;
  }
  .tip::before{content:'i'}
  .tip:hover,.tip:focus-visible{color:#fff;background:var(--accent);border-color:var(--accent);outline:none}
  #tooltip{
    position:fixed;z-index:1000;display:none;max-width:300px;
    background:#fff;color:#111;border-left:4px solid var(--accent);padding:10px 12px;
    font:400 12.5px/1.5 var(--font);pointer-events:none;
  }

  /* ── 3D scene ── */
  .stage{position:relative;background:#0a0a0a;height:660px;overflow:hidden;touch-action:none;cursor:grab;user-select:none}
  .stage:active{cursor:grabbing}
  .scene{position:absolute;inset:0;perspective:1500px;perspective-origin:50% 42%}
  .worldZoom{position:absolute;left:50%;top:50%;transform-style:preserve-3d}
  .world{position:absolute;transform-style:preserve-3d}
  .obj,.face{position:absolute;transform-style:preserve-3d}
  .face{backface-visibility:visible}

  .slab{border-top:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.015)}
  .slab.main{border-top:2px solid var(--accent);background:rgba(27,161,226,.06)}
  .roof{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.18)}
  .groundP{
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, transparent 1px 56px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, transparent 1px 56px);
  }
  .shaftF{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.08)}
  .shaftF.frontF{border-color:rgba(255,255,255,.14)}

  .carFace{opacity:1}
  .carSide{filter:brightness(.7)}
  .carTop{filter:brightness(1.15)}
  .carFront{overflow:hidden;display:flex;align-items:stretch;justify-content:space-between}
  .carFront .occ{position:absolute;top:2px;left:0;right:0;text-align:center;font:700 9px/1 var(--font);color:#fff;z-index:3}
  .door{position:absolute;top:0;bottom:0;width:50%;background:rgba(0,0,0,.45);transition:transform .5s cubic-bezier(.1,.9,.2,1);z-index:2}
  .doorL{left:0;border-right:1px solid rgba(255,255,255,.35)}
  .doorR{right:0;border-left:1px solid rgba(255,255,255,.35)}
  .car.open .doorL{transform:translateX(-92%)}
  .car.open .doorR{transform:translateX(92%)}

  .flabel{font:600 9px/1 var(--font);color:#777;text-align:right;width:26px}
  .lant{display:flex;flex-direction:column;gap:1px;align-items:center;width:14px}
  .lant span{font:800 8px/1 var(--font);color:transparent;transition:color .15s}

  .hud{position:absolute;left:0;bottom:0;right:0;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:8px 12px;pointer-events:none;font-size:12px;color:var(--dim);background:linear-gradient(transparent,rgba(0,0,0,.6))}
  .ticker{font-size:12px;color:#ddd;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hint{font-size:11px;text-align:right}

  .stageBtns{position:absolute;top:0;right:0;display:flex;gap:0}
  .stageBtns button{background:rgba(0,0,0,.7);border:0;color:#ddd;font-size:12px;padding:8px 12px;cursor:pointer;text-transform:lowercase}
  .stageBtns button:hover{background:#333;color:#fff}
  .stageBtns button.on{background:var(--accent);color:#fff}
  .stageBtns button.cfg{background:var(--t-max);color:#fff}

  /* ── Sidebar / cards ── */
  .side{display:flex;flex-direction:column;gap:20px}
  .card{background:transparent;padding:0}
  .card h2{margin:0 0 6px;font:300 26px/1.1 var(--font-light);text-transform:lowercase;color:var(--text)}

  /* car tiles */
  .cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
  .carChip{position:relative;color:#fff;padding:8px 10px 9px;min-height:84px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .12s}
  .carChip:hover{transform:scale(.97)}
  .carChip .nm{font-size:11px;font-weight:600;opacity:.9}
  .carChip .fl{font:200 34px/1 var(--font-light);font-variant-numeric:tabular-nums}
  .carChip .st{font-size:11px;font-variant-numeric:tabular-nums;opacity:.9}

  /* metric tiles */
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
  .stat{padding:10px 12px 11px;color:#fff;min-height:84px;display:flex;flex-direction:column;justify-content:space-between}
  .stat:nth-child(1){background:var(--t-wait)}
  .stat:nth-child(2){background:var(--t-max)}
  .stat:nth-child(3){background:var(--t-trip)}
  .stat:nth-child(4){background:var(--t-served)}
  .stat:nth-child(5){background:var(--t-rate)}
  .stat .v{font:200 32px/1.05 var(--font-light);font-variant-numeric:tabular-nums}
  .stat .l{font-size:11.5px;font-weight:600;opacity:.92;text-transform:lowercase}
  .stat .v .u{font-size:14px;font-weight:400;opacity:.85}

  /* call-from-floor list */
  .floors{max-height:248px;overflow-y:auto;background:var(--panel)}
  .frow{display:grid;grid-template-columns:38px 34px 34px 1fr;align-items:center;gap:4px;padding:2px 10px;min-height:28px}
  .frow:nth-child(even){background:rgba(255,255,255,.025)}
  .frow .fl{font:600 13px/1 var(--font);color:var(--dim);font-variant-numeric:tabular-nums}
  .frow.lobby .fl{color:var(--accent)}
  .cbtn{background:transparent;border:2px solid #444;color:#888;font-size:10px;line-height:1;padding:4px 0;cursor:pointer;width:30px}
  .cbtn:hover{border-color:#fff;color:#fff}
  .cbtn.active{color:#fff !important;border-color:transparent}
  .frow .who{display:flex;gap:4px;justify-content:flex-end;align-items:center}
  .dot{width:10px;height:10px;background:currentColor}
  .frow .n{font:600 11px/1 var(--font);color:var(--dim);margin-right:4px}

  /* controls */
  .ctl{display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .row label{font-size:13px;color:var(--dim)}
  .seg{display:flex;gap:2px}
  .seg button{background:var(--panel-2);border:0;color:#ccc;font-size:12px;padding:6px 11px;cursor:pointer;white-space:nowrap;text-transform:lowercase}
  .seg button:hover{background:#3a3a3a;color:#fff}
  .seg button.on{background:var(--accent);color:#fff}
  .langSeg button{text-transform:none;font-weight:600;padding:6px 12px}
  input[type=range]{width:130px;accent-color:var(--accent)}
  .val{font:600 13px/1 var(--font);color:var(--text);min-width:66px;text-align:right;font-variant-numeric:tabular-nums}
  .chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);cursor:pointer}
  .chk input{accent-color:var(--accent);width:16px;height:16px}
  .btnrow{display:flex;gap:6px}
  .btn{flex:1;background:var(--panel-2);border:2px solid var(--panel-2);color:var(--text);font-size:13px;font-weight:600;padding:8px 0;cursor:pointer;text-transform:lowercase;transition:transform .08s}
  .btn:hover{background:#3a3a3a;border-color:#3a3a3a}
  .btn:active{transform:scale(.97)}
  .btn.warn{background:transparent;border-color:#fff;color:#fff}
  .btn.warn:hover{background:#fff;color:#000}
  .spark{display:block;width:100%;height:64px;background:var(--panel)}

  /* explainer */
  details.exp{margin-top:20px;background:var(--panel);padding:0}
  details.exp summary{cursor:pointer;padding:14px 18px;font:300 22px/1.2 var(--font-light);text-transform:lowercase;list-style:none}
  details.exp summary::-webkit-details-marker{display:none}
  details.exp summary::before{content:'+ ';color:var(--accent);font-weight:400}
  details.exp[open] summary::before{content:'− '}
  .expBody{padding:0 18px 18px;max-width:74ch}
  .expBody h3{font:600 14px/1.3 var(--font);margin:16px 0 4px;color:var(--accent)}
  .expBody p{margin:4px 0;color:#d0d0d0;font-size:14px}
  .expBody code{font-family:var(--mono);font-size:12px;background:var(--panel-2);padding:1px 5px}

  .cap{margin:0 0 6px;font-size:12px;line-height:1.5;color:var(--dim)}
  .cap b{color:var(--text);font-weight:600}
  .ctl .cap{margin:-4px 0 4px}

  /* log */
  .log{max-height:220px;overflow-y:auto;font:12px/1.75 var(--font);color:#cfcfcf;background:var(--panel);padding:4px 0}
  .log .e{display:flex;gap:10px;padding:1px 12px}
  .log .e:first-child{color:#fff;background:rgba(27,161,226,.12)}
  .log .t{color:#777;flex:0 0 40px;text-align:right;font-variant-numeric:tabular-nums}
  .log .cn{display:inline-block;min-width:18px;padding:0 4px;color:#fff;text-align:center;font-weight:700;line-height:1.5}
  .log b{font-weight:700}

  ::-webkit-scrollbar{width:8px}
  ::-webkit-scrollbar-thumb{background:#444}
  ::-webkit-scrollbar-track{background:transparent}

  @media (prefers-reduced-motion: reduce){
    .door,.carChip,.btn{transition:none}
  }
</style>

<div class="wrap">
  <header>
    <div class="htext">
      <h1 id="h1" data-th="h1"></h1>
      <div class="spec" id="spec"></div>
    </div>
    <div class="seg langSeg" id="langSeg">
      <button data-v="en" class="on">EN</button>
      <button data-v="bg">BG</button>
    </div>
  </header>

  <!-- ══════════════ SETUP ══════════════ -->
  <section id="setup" class="setup">
    <div class="setupHead">
      <h2 data-t="setup_title"></h2>
      <p class="cap" data-t="setup_sub"></p>
    </div>
    <div class="setupGrid">
      <div class="fgroup">
        <h3 data-t="grp_structure"></h3>
        <label class="field"><span class="lbl"><span data-t="f_floors"></span><i class="tip" tabindex="0" data-tip="tip_floors"></i></span><input type="number" id="cfgFloors" min="2" max="60" step="1"></label>
        <label class="field"><span class="lbl"><span data-t="f_parking"></span><i class="tip" tabindex="0" data-tip="tip_parking"></i></span><input type="number" id="cfgParking" min="0" max="6" step="1"></label>
      </div>

      <div class="fgroup">
        <h3 data-t="grp_occ"></h3>
        <label class="field"><span class="lbl"><span data-t="f_apts"></span><i class="tip" tabindex="0" data-tip="tip_apts"></i></span><input type="number" id="cfgApts" min="1" max="5000" step="1"></label>
        <label class="field"><span class="lbl"><span data-t="f_res"></span><i class="tip" tabindex="0" data-tip="tip_res"></i></span><input type="number" id="cfgRes" min="1" max="20000" step="1"></label>
        <p class="cap" data-t="f_res_note"></p>
      </div>

      <div class="fgroup">
        <h3 data-t="grp_phys"></h3>
        <label class="field"><span class="lbl"><span data-t="f_spf"></span><i class="tip" tabindex="0" data-tip="tip_spf"></i></span><input type="number" id="cfgSpf" min="0.3" max="6" step="0.1"></label>
        <label class="field"><span class="lbl"><span data-t="f_door"></span><i class="tip" tabindex="0" data-tip="tip_door"></i></span><input type="number" id="cfgDoor" min="0" max="12" step="0.5"></label>
        <label class="field"><span class="lbl"><span data-t="f_hold"></span><i class="tip" tabindex="0" data-tip="tip_hold"></i></span><input type="number" id="cfgHold" min="0.5" max="12" step="0.5"></label>
        <label class="field"><span class="lbl"><span data-t="f_board"></span><i class="tip" tabindex="0" data-tip="tip_board"></i></span><input type="number" id="cfgBoard" min="0" max="3" step="0.1"></label>
      </div>

      <div class="fgroup">
        <h3 data-t="grp_traffic"></h3>
        <div class="field"><span class="lbl"><span data-t="f_pattern"></span><i class="tip" tabindex="0" data-tip="tip_pattern"></i></span>
          <div class="seg" id="cfgPatSeg">
            <button data-v="mixed" data-t="pat_mixed"></button>
            <button data-v="morning" data-t="pat_morning"></button>
            <button data-v="evening" data-t="pat_evening"></button>
          </div>
        </div>
        <div class="chkrow"><label class="chk"><input type="checkbox" id="cfgRateAuto"> <span id="rateAutoLbl"></span></label><i class="tip" tabindex="0" data-tip="tip_rate"></i></div>
        <label class="field" id="rateManualWrap"><span class="lbl"><span data-t="f_rate"></span></span><input type="number" id="cfgRate" min="0" max="150" step="1"></label>
        <div class="chkrow"><label class="chk"><input type="checkbox" id="cfgPark"> <span data-t="f_park_beh"></span></label><i class="tip" tabindex="0" data-tip="tip_park"></i></div>
      </div>

      <div class="fgroup wide">
        <h3 data-t="grp_elev"></h3>
        <label class="field"><span class="lbl"><span data-t="f_count"></span><i class="tip" tabindex="0" data-tip="tip_count"></i></span><input type="number" id="cfgCount" min="1" max="16" step="1"></label>
        <p class="cap" data-t="elev_note"></p>
        <div class="elevHead"><span data-t="col_car"></span><span class="hcell"><span data-t="col_cap"></span><i class="tip" tabindex="0" data-tip="tip_cap"></i></span><span class="hcell"><span data-t="col_home"></span><i class="tip" tabindex="0" data-tip="tip_home"></i></span></div>
        <div class="elevRows" id="elevRows"></div>
        <p class="cap" id="elevSummary"></p>
      </div>
    </div>
    <div class="setupActions">
      <button class="btn warn" id="defaultsBtn" data-t="btn_defaults"></button>
      <button class="btn start" id="startBtn" data-t="btn_start"></button>
    </div>
  </section>

  <!-- ══════════════ APP ══════════════ -->
  <div id="app" hidden>
    <main>
      <div>
        <div class="stage" id="stage">
          <div class="scene"><div class="worldZoom" id="zoomEl"><div class="world" id="world"></div></div></div>
          <div class="stageBtns">
            <button id="cfgBtn" class="cfg" data-t="btn_reconf"></button>
            <button id="rotBtn" data-t="btn_rot"></button>
            <button id="pauseBtn"></button>
          </div>
          <div class="hud">
            <div class="ticker" id="ticker"></div>
            <div class="hint" data-th="hint"></div>
          </div>
        </div>

        <section class="card" style="margin-top:14px">
          <h2 data-t="log_h2"></h2>
          <p class="cap" data-t="log_cap"></p>
          <div class="log" id="log"></div>
        </section>

        <details class="exp">
          <summary data-t="exp_summary"></summary>
          <div class="expBody">
            <h3 data-t="exp_h1"></h3><p data-th="exp_p1"></p>
            <h3 data-t="exp_h2"></h3><p data-th="exp_p2"></p>
            <h3 data-t="exp_h3"></h3><p data-th="exp_p3"></p>
            <h3 data-t="exp_h4"></h3><p data-th="exp_p4"></p>
            <h3 data-t="exp_h5"></h3><p data-th="exp_p5"></p>
            <h3 data-t="exp_h6"></h3><p data-th="exp_p6"></p>
            <h3 data-t="exp_h7"></h3><p data-th="exp_p7"></p>
          </div>
        </details>
      </div>

      <aside class="side">
        <section class="card">
          <h2 data-t="cars_h2"></h2>
          <p class="cap" data-t="cars_cap"></p>
          <div class="cars" id="carChips"></div>
        </section>

        <section class="card">
          <h2 data-t="stats_h2"></h2>
          <p class="cap" data-t="stats_cap"></p>
          <div class="stats">
            <div class="stat"><div class="v" id="sWait">—</div><div class="l" data-t="stat_wait"></div></div>
            <div class="stat"><div class="v" id="sMax">—</div><div class="l" data-t="stat_max"></div></div>
            <div class="stat"><div class="v" id="sTrip">—</div><div class="l" data-t="stat_trip"></div></div>
            <div class="stat"><div class="v" id="sServed">0</div><div class="l" data-t="stat_served"></div></div>
            <div class="stat" style="grid-column:span 2"><div class="v" id="sRate">—</div><div class="l" id="sRateL"></div></div>
          </div>
        </section>

        <section class="card">
          <h2 data-t="floors_h2"></h2>
          <p class="cap" data-t="floors_cap"></p>
          <div class="floors" id="floorPanel"></div>
        </section>

        <section class="card ctl">
          <h2 data-t="ctl_h2"></h2>
          <div class="row"><span class="rowlbl"><label data-t="lbl_alg"></label><i class="tip" tabindex="0" data-tip="tip_alg"></i></span>
            <div class="seg" id="algSeg">
              <button data-v="naive" data-t="alg_naive"></button>
              <button data-v="v0" class="on" data-t="alg_smart"></button>
              <button data-v="learned" data-t="alg_learned"></button>
            </div>
          </div>
          <p class="cap" data-th="cap_alg"></p>
          <div class="row"><span class="rowlbl"><label data-t="lbl_pattern"></label><i class="tip" tabindex="0" data-tip="tip_pattern"></i></span>
            <div class="seg" id="patSeg">
              <button data-v="mixed" data-t="pat_mixed"></button>
              <button data-v="morning" data-t="pat_morning"></button>
              <button data-v="evening" data-t="pat_evening"></button>
            </div>
          </div>
          <p class="cap" data-th="cap_pattern"></p>
          <div class="row"><span class="rowlbl"><label data-t="lbl_rate"></label><i class="tip" tabindex="0" data-tip="tip_rate"></i></span>
            <span style="display:flex;align-items:center;gap:8px">
              <input type="range" id="rateSl" min="0" max="30" value="5" step="1">
              <span class="val" id="rateV"></span>
            </span>
          </div>
          <p class="cap" id="rateHint"></p>
          <div class="row"><span class="rowlbl"><label data-t="lbl_speed"></label><i class="tip" tabindex="0" data-tip="tip_speed"></i></span>
            <div class="seg" id="spdSeg">
              <button data-v="1">1×</button>
              <button data-v="2" class="on">2×</button>
              <button data-v="4">4×</button>
              <button data-v="8">8×</button>
            </div>
          </div>
          <p class="cap" data-t="cap_speed"></p>
          <div class="chkrow"><label class="chk"><input type="checkbox" id="parkChk" checked> <span data-t="park_label"></span></label><i class="tip" tabindex="0" data-tip="tip_park"></i></div>
          <p class="cap" data-t="cap_park"></p>
          <div class="btnrow">
            <button class="btn warn" id="resetBtn" data-t="reset_btn"></button>
            <i class="tip" tabindex="0" data-tip="tip_reset" style="align-self:center"></i>
          </div>
          <p class="cap" data-t="cap_reset"></p>
        </section>

        <section class="card ctl" id="learnCard">
          <h2 data-t="learn_h2"></h2>
          <p class="cap" data-th="learn_cap"></p>
          <div class="row"><span class="rowlbl"><label data-t="learn_lbl"></label><i class="tip" tabindex="0" data-tip="tip_learn"></i></span>
            <span class="val" id="learnState"></span>
          </div>
          <p class="cap" id="learnStatus"></p>
          <canvas class="spark" id="learnCurve"></canvas>
          <p class="cap" id="learnGen"></p>
          <div class="btnrow">
            <button class="btn warn" id="learnBtn"></button>
            <button class="btn" id="learnResetBtn" data-t="learn_reset"></button>
          </div>
          <div class="btnrow">
            <button class="btn" id="learnExportBtn" data-t="learn_export"></button>
            <button class="btn" id="learnImportBtn" data-t="learn_import"></button>
            <input type="file" id="learnFile" accept=".json,application/json" hidden>
          </div>
          <p class="cap" data-t="cap_learn_io"></p>
        </section>
      </aside>
    </main>
  </div>
</div>
<script type="module" src="./src/ui/main.ts"></script>
</html>
